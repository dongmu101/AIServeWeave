name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default Go/Console gates remain offline; database-integration uses
# isolated real engines for J08/P07 upgrade, failure, and native recovery tests.
# 默认 Go/Console 门禁保持离线；database-integration 使用独立真实引擎，
# 执行 J08/P07 的升级、故障与原生恢复测试。
jobs:
  go:
    name: Go 格式 / vet / build / proto / test / race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l ./service ./api)"
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化 / the following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 校验 proto 生成结果与仓库一致 / verify proto generation is up to date
        run: |
          go generate ./api/...
          if ! git diff --exit-code -- api/; then
            echo "生成代码与 .proto 不一致，请在本地重新执行 'go generate ./api/...' 并提交结果 / generated code is out of date, rerun 'go generate ./api/...' locally and commit the result"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: go test -race（仅数据面服务，与 AGENTS.md 质量门禁一致）
        run: go test -race ./service/...

  console:
    name: Console lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/aiServeWeaveConsole
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: service/aiServeWeaveConsole/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: service/aiServeWeaveConsole/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm build
        run: pnpm build

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

  database-integration:
    name: PostgreSQL 18 / MySQL 9.7 升级与恢复（J08/P07）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aisw
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: aiserveweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aisw -d aiserveweave"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: aiserveweave
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      AISW_POSTGRES_TEST_DSN: "postgres://aisw:integration-only@127.0.0.1:5432/aiserveweave?sslmode=disable"
      AISW_MYSQL_TEST_DSN: "root:@tcp(127.0.0.1:3306)/aiserveweave?parseTime=True&charset=utf8mb4"
      AISW_REDIS_TEST_ADDR: "127.0.0.1:6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test -race（双数据库、原生备份恢复及 Redis outbox）
        env:
          AISW_POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
          AISW_MYSQL_TEST_CONTAINER: ${{ job.services.mysql.id }}
        run: go test -race -p 1 ./service/aiServeWeaveControlPlane/...
