name: Release

# 打一个 vX.Y.Z tag 触发：重跑一遍质量门禁，交叉编译四个二进制的全部受支持平台，
# 生成校验和，构建并推送五个服务的多架构容器镜像到 GHCR，创建 GitHub Release。
# Release 资产还包含 Agent 安装脚本（agent.sh、agent.ps1、install.sh、install.ps1），
# 由 scripts/build-release.sh 放进 dist/ 并纳入总校验和；Gateway 镜像内置同版本的 Agent 制品。
# 流程与版本策略见根 RELEASING.md，不在这里重复。
#
# Fires on a vX.Y.Z tag push: reruns the quality gates, cross-compiles all
# four binaries for every supported platform, generates checksums, builds and
# pushes multi-arch images for all five services to GHCR, and creates a
# GitHub Release. The release assets also include the Agent install scripts
# (agent.sh, agent.ps1, install.sh, install.ps1), which scripts/build-release.sh
# puts in dist/ under the overall checksums; the Gateway image bakes in the
# same version's Agent artifacts. The process and versioning policy live in the
# root RELEASING.md — not repeated here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # create the GitHub Release and upload its assets
  packages: write   # push images to GHCR

jobs:
  verify:
    name: 发布前质量门禁（同 CI）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l ./service ./api)"
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化 / the following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 校验 proto 生成结果与仓库一致 / verify proto generation is up to date
        run: |
          go generate ./api/...
          if ! git diff --exit-code -- api/; then
            echo "生成代码与 .proto 不一致，发布中止 / generated code is out of date, aborting release"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: go test -race（仅数据面服务）
        run: go test -race ./service/...

  binaries:
    name: 交叉编译二进制与校验和
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: scripts/build-release.sh
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh

      - name: Upload dist as a build artifact（供 release 作业下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  images:
    name: 构建并推送容器镜像
    # The Go images copy the binaries job's dist/ instead of compiling again,
    # so they carry the very bytes of the Release.
    # Go 镜像拷贝 binaries 作业的 dist/，不再重新编译，与 Release 是同一批字节。
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: registry
            context: .
            service: aiServeWeaveRegistry
            build_args: SERVICE=aiServeWeaveRegistry
          - image: controlplane
            context: .
            service: aiServeWeaveControlPlane
            build_args: SERVICE=aiServeWeaveControlPlane
          - image: gateway
            context: .
            service: aiServeWeaveGateway
            build_args: SERVICE=aiServeWeaveGateway
          - image: console
            context: service/aiServeWeaveConsole
            build_args: ""
            web: true
          - image: studio
            context: service/aiServeWeaveStudio
            build_args: ""
            web: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Console and Studio Dockerfiles only copy the standalone output; it is
      # compiled here, outside Docker.
      # Console 与 Studio 的 Dockerfile 只拷贝 standalone 产物；产物在这里、Docker 之外编译。
      - name: Set up pnpm
        if: matrix.web
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.context }}/package.json

      - name: Set up Node.js
        if: matrix.web
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.context }}/pnpm-lock.yaml

      - name: Build frontend（pnpm build）
        if: matrix.web
        run: scripts/build-web.sh ${{ matrix.context }}

      # The root Dockerfile only copies .image-build/; build-go.sh fills it
      # from dist/ after checking SHA256SUMS.txt, without the Go toolchain.
      # 根目录 Dockerfile 只拷贝 .image-build/；build-go.sh 校验 SHA256SUMS.txt 后从 dist/
      # 填充它，不需要 Go 工具链。
      - name: Download dist
        if: matrix.service
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 摆出镜像二进制（scripts/build-go.sh，取自 dist/）
        if: matrix.service
        env:
          VERSION: ${{ github.ref_name }}
          PREBUILT: dist
          PLATFORMS: linux/amd64 linux/arm64
        run: scripts/build-go.sh ${{ matrix.service }}

      - name: Set up QEMU（跨架构模拟，供 buildx 构建 linux/arm64）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiserveweave-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aiserveweave-${{ matrix.image }}:latest

  release:
    name: 创建 GitHub Release
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（读 CHANGELOG）
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 提取本版本的 CHANGELOG 小节 / extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$version]" '
            index($0, ver) == 1 { found=1; next }
            found && (/^## \[/ || /^\[.*\]: http/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 里没有找到 [$version] 小节，发布中止 / no [$version] section found in CHANGELOG.md, aborting" >&2
            exit 1
          fi

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # make release creates the Release from a local build before this
        # workflow gets here; keep that one instead of failing.
        # make release 在本流水线走到这里之前已用本地构建创建了 Release；保留它，不报错。
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在（make release 创建），跳过 / already exists, skipping"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*
