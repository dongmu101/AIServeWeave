auto_discover: true
auto_discover_interval: 30s
gateway:
    allowed_runtimes:
        - codex-local
    bootstrap_token_file: ./data/bootstrap-token
    ca_file: ./data/compose-ca-cert.pem
    cert_file: ./data/agent-cert.pem
    endpoints:
        - 127.0.0.1:8443
    key_file: ./data/agent-key.pem
    labels:
        gpu: "4090"
        region: home-mac
    max_gateways: 4
    node_id: node-mac-01
    registry: 127.0.0.1:9443
log_level: info
metrics_addr: 127.0.0.1:9092
runtimes:
    - base_url: ""
      id: codex-local
      kind: codex
