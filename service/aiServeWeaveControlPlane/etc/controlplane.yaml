# aiserveweave-controlplane configuration.
#
# 三个密钥从环境变量注入，本文件里没有任何一个的取值。
# 用 `openssl rand -base64 32` 各生成一个独立的值再 export。
#
# 三个密钥写成 ${VAR}：conf.UseEnv 会展开它们，未设置时展开为空串，而 Validate
# 要求至少 32 字符，因此忘记注入的部署会带着一条可操作的报错启动失败——而不是
# 带着一个提交在仓库里、人人可见的占位符继续跑下去。
#
# The three secrets are injected from the environment; no value for any of them
# lives in this file. Generate an independent value for each with
# `openssl rand -base64 32` and export it.
#
# They are written as ${VAR}: conf.UseEnv expands them, an unset variable
# expands to the empty string, and Validate requires at least 32 characters —
# so a deployment that forgot to inject them fails to start with an actionable
# error rather than running on a placeholder that is committed here for anyone
# to read.

Name: aiserveweave-controlplane
Host: 127.0.0.1
Port: 8090

# go-zero 的访问日志。控制面处理凭据，因此不记录请求体。
# go-zero's access log. The control plane handles credentials, so bodies are
# not logged.
Log:
  ServiceName: aiserveweave-controlplane
  Mode: console
  Level: info

Database:
  # postgres 或 mysql。PostgreSQL 是首要目标（后续 JSON 列会用到 JSONB），
  # MySQL 同样受支持——当前五张基础表只用标量列，两种引擎表达一致。
  # postgres or mysql. PostgreSQL is the primary target (JSONB matters for the
  # JSON columns still to come); MySQL is supported too — today's five base tables
  # use only scalar columns, which both engines express identically.
  Driver: postgres
  DSN: "postgres://aisw:aisw@127.0.0.1:5432/aiserveweave?sslmode=disable"
  # MySQL 写法（注意 parseTime=True，否则每个时间列都会扫描失败）：
  # The MySQL form (parseTime=True is required, or every time column fails to
  # scan):
  # Driver: mysql
  # DSN: "aisw:aisw@tcp(127.0.0.1:3306)/aiserveweave?charset=utf8mb4&parseTime=True&loc=Local"
  MaxOpenConns: 20
  MaxIdleConns: 5
  ConnMaxLifetime: 30m
  # Apply embedded versioned SQL locally; production runs -migrate up first,
  # then starts with this disabled and checks schema compatibility only.
  # 本地执行内嵌版本 SQL；生产先运行 -migrate up，再关闭本项，仅检查 schema 兼容性。
  AutoMigrate: true

# 必填。Redis 存储可吊销的 Console 会话，并缓存 API Key 校验。
# Required. Redis stores revocable Console sessions and caches API key verification.
Redis:
  Addr: "127.0.0.1:6379"
  Password: ""
  DB: 0
  # Natural verification-cache expiry; the transactional outbox retries
  # revocation notifications across crashes. TTL remains defense in depth.
  # 校验缓存的自然过期时间；事务 outbox 跨崩溃重试吊销通知，TTL 保留为纵深防御。
  TTL: 30s

Auth:
  # 占位符，务必替换。
  # Placeholder. Replace it.
  AccessSecret: "${AISW_ACCESS_SECRET}"
  AccessExpire: 12h

# Gateway 用它调用 /internal/v1/apikeys/verify。
# The Gateway presents this to /internal/v1/apikeys/verify.
InternalToken: "${AISW_INTERNAL_TOKEN}"

# 授权创建租户。它是 Console 将来注册流程的临时替身。
# Authorizes tenant creation. It stands in for the Console's eventual sign-up
# flow.
BootstrapToken: "${AISW_BOOTSTRAP_TOKEN}"
