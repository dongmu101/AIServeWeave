        "503":
          $ref: "#/components/responses/StudioUnavailable"
    post:
      tags: [studio]
      summary: 新建编排（保存第 1 个版本）
      description: |
        `definition` 由控制面按 flowdef 规则校验，不合格返回 400 `invalid_flow` 并附问题列表
        （见 StudioIssuesError）。请求体上限约 1 MiB + 64 KiB（413 `too_large`），未知字段被拒绝。
      operationId: studioCreateFlow
      security:
        - studioSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioFlowCreate"
      responses:
        "201":
          description: 新编排（含 definition）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioFlow"
        "400":
          $ref: "#/components/responses/StudioIssuesError"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "409":
          $ref: "#/components/responses/StudioConflict"
        "413":
          $ref: "#/components/responses/StudioTooLarge"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/flows/{id}:
    parameters:
      - $ref: "#/components/parameters/StudioFlowID"
    get:
      tags: [studio]
      summary: 读取一个编排的最新版本
      operationId: studioGetFlow
