openapi: 3.0.3
info:
  title: AIServeWeave Gateway API
  description: |
    aiServeWeaveGateway 对外暴露的两组 HTTP 接口：

    - **公开推理前门**（默认监听地址，需要租户 API Key）：OpenAI 兼容的
      chat/embeddings/responses/models，以及工作流 Job 的提交、状态、SSE 事件流、
      取消与产物下载。
    - **只读运维接口**（`-admin-addr` 单独配置时才挂载，使用部署密钥而非租户 Key）：
      机群清单、工作流目录、按租户的 job 列表与路由生效状态，供控制面聚合展示，不做任何写操作。

    源码位置：`service/aiServeWeaveGateway/httpapi/`（公开前门）与
    `service/aiServeWeaveGateway/adminapi/`（运维接口）。
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: 公开推理前门（默认端口，可通过 -addr 配置）
  - url: http://localhost:8081
    description: 只读运维接口（通过 -admin-addr 单独配置，未配置则不启动）

tags:
  - name: models
    description: 模型发现
  - name: chat
    description: OpenAI 兼容的 Chat Completions
  - name: embeddings
    description: OpenAI 兼容的 Embeddings
  - name: responses
    description: OpenAI 兼容的 Responses（转换为 canonical chat 请求）
  - name: workflows
    description: 工作流 Job 的提交、状态、事件、取消与产物
  - name: admin
    description: 只读运维接口（机群清单 / 工作流目录 / 按租户 job），使用部署密钥
  - name: studio
    description: Studio API（`/studio/v1`，仅以 `-studio` 启动时挂载；只接受控制面会话令牌，不接受 API Key）：对话、编排与运行

security:
  - bearerAuth: []

paths:
  /v1/models:
    get:
      tags: [models]
      summary: 列出当前至少一个已连接节点声明支持 chat 能力的模型
      operationId: listModels
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /v1/chat/completions:
    post:
      tags: [chat]
      summary: OpenAI 兼容的 Chat Completions（支持流式与非流式）
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: |
            非流式：完整的 ChatCompletionResponse。
            流式（stream=true）：`text/event-stream`，逐帧 `data: <ChatCompletionChunk>`，
            以 `data: [DONE]` 结束。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE 帧序列，每帧为 ChatCompletionChunk 的 JSON
        "400":
          $ref: "#/components/responses/OpenAIError"
        "404":
          $ref: "#/components/responses/OpenAIError"
        "429":
          $ref: "#/components/responses/OpenAIError"
        "5XX":
          $ref: "#/components/responses/OpenAIError"

  /v1/embeddings:
    post:
      tags: [embeddings]
      summary: OpenAI 兼容的 Embeddings
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingsRequest"
      responses:
        "200":
          description: 向量列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingsResponse"
        "400":
          $ref: "#/components/responses/OpenAIError"
        "404":
          $ref: "#/components/responses/OpenAIError"

  /v1/responses:
    post:
      tags: [responses]
      summary: OpenAI 兼容的 Responses（边界处转换为 canonical chat 请求）
      description: |
        `store=true` 与 `previous_response_id` 仅在配置了控制面、且调用方认证到
        真实租户时生效（Claude CLI 模型同样适用），否则被拒绝（400）；
        `background=true` 始终被拒绝（400），本 Gateway 不做后台任务。内置工具（web_search 等）与非 function 类型的工具同样被拒绝。
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: |
            非流式：完整的 Response 对象。流式（stream=true）：`text/event-stream`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseObject"
        "400":
          $ref: "#/components/responses/OpenAIError"
        "404":
          $ref: "#/components/responses/OpenAIError"

  /v1/workflows/{workflow_id}/runs:
    post:
      tags: [workflows]
      summary: 提交一次工作流运行
      description: |
        请求体只携带模板已声明的输入值；图本身来自服务端注册的模板，调用方无法传入
        任意图。

        模板不声明文件类型输入（`type: file`）时用 `application/json`，请求体上限
        1 MiB。模板声明了文件类型输入时（STATUS.md 的 P04）改用
        `multipart/form-data`：`inputs` 表单字段携带与 JSON 形态相同的请求体，其余
        每个表单字段名对应一个已声明的文件输入名、值为该文件的字节；整个请求上限
        200 MiB。字节先被 Gateway 挑中的节点接收，再经该节点写入其本地 ComfyUI 的
        输入目录——因此含文件输入的提交固定在单个候选节点上，不做跨节点重试：那个
        节点的分发失败即整体失败，不会换一个节点重新上传文件。

        部署开启工作流持久队列（`-workflow-queue-max-wait`）时，JSON 提交会进入由
        所有 Gateway 副本共享的 Redis 队列并立即返回 202：`status=queued`、
        `durability=shared_queue`、`queue_position` 为全集群名次。任一副本的 worker
        都会在节点空闲时派发它，等待超过期限即以 `error_code=queue_timeout` 失败。
        multipart 提交不入队。
      operationId: submitWorkflowRun
      parameters:
        - $ref: "#/components/parameters/WorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
          multipart/form-data:
            schema:
              type: object
              properties:
                inputs:
                  type: string
                  description: 与 application/json 形态相同的请求体，作为 JSON 字符串放进这个表单字段
              additionalProperties:
                type: string
                format: binary
                description: 表单字段名即模板声明的文件输入名，值为该文件的字节
      responses:
        "202":
          description: 已接受，返回刚创建的 job（状态多为 queued）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/OpenAIError"
        "404":
          description: 工作流模板未注册，或没有节点能运行工作流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"
        "429":
          description: 全集群工作流队列已满（`queue_full`），按 `Retry-After` 稍后重试
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"
        "503":
          description: 队列无法确认这次提交是否已入队（`queue_unavailable`）；重提之前先查询 job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"

  /v1/jobs/{job_id}:
    get:
      tags: [workflows]
      summary: 查询一次运行的状态
      description: |
        已结束的运行直接由本 Gateway 的内存 job 表作答；仍在进行中的会去问运行它的
        节点，状态来自后端的队列与历史。开启工作流持久队列时，本副本查不到的 job 会
        改读共享队列记录：排队中返回 `queued` 与名次，被队列判为失败或取消的返回终态
        与 `error_code`，已派发的接着向运行它的节点查询。共享记录暂时读不到时答 503
        `queue_unavailable`（而不是 404）；取消与产物列举同样如此。
      operationId: getJobStatus
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: job 当前视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/OpenAIError"
        "503":
          description: 共享工作流队列暂时不可读（`queue_unavailable`），稍后重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"

  /v1/jobs/{job_id}/events:
    get:
      tags: [workflows]
      summary: 订阅一次运行的事件流（SSE）
      description: |
        已经结束的运行会立即得到携带终态的单独一帧而不是订阅。事件名（SSE 的
        `event:` 字段）为后端事件类型（如 progress、node_output、succeeded、
        failed、cancelled 等），载荷为 JobEvent。仍在共享工作流队列中的 job 先收到
        `queue_changed` 帧（`data.position` 为名次），派发后接上节点的事件。
      operationId: streamJobEvents
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: text/event-stream，逐帧 JobEvent
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/OpenAIError"
        "5XX":
          $ref: "#/components/responses/OpenAIError"

  /v1/jobs/{job_id}/cancel:
    post:
      tags: [workflows]
      summary: 请求取消一次运行
      description: |
        取消是异步请求而不是结论：本端点返回 202 与最后已知的 job 视图，真实结果由
        状态端点或事件流报告。已结束的 job 返回 409；节点不支持中断时返回 501。
        仍在共享工作流队列中、尚未派发的 job 会被直接取消，202 返回
        `status=cancelled`——没有后端见过它，因此这是确定的结论。
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: 取消请求已接受
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/OpenAIError"
        "409":
          description: job 已结束，无法取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"
        "501":
          description: 运行该 job 的节点不支持中断
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorBody"

  /v1/jobs/{job_id}/artifacts:
    get:
      tags: [workflows]
      summary: 列出一次运行产出的产物
      description: |
        公开的 artifact_id 在这里铸造：后端用 filename/subfolder/type 三元组定位
        文件，该三元组从不作为标识符外传。同一 job 多次列举返回相同的 id。
      operationId: listJobArtifacts
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: 产物列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "404":
          $ref: "#/components/responses/OpenAIError"

  /v1/artifacts/{artifact_id}:
    get:
      tags: [workflows]
      summary: 下载一个产物
      description: 响应体直通转发，从隧道边读边送，从不在 Gateway 进程内整体缓冲。
      operationId: downloadArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 产物内容（Content-Type 与 Content-Disposition 视后端而定）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/OpenAIError"

  /internal/v1/routes:
    get:
      tags: [admin]
      summary: 本副本实际应用的路由版本与最近同步状态
      description: 仅在运维监听器提供；文件模式不会被视为控制面版本确认。错误为固定代号，不包含配置或凭据。
      operationId: getAppliedRoutes
      security:
        - adminToken: []
      responses:
        "200":
          description: 路由生效状态
          content:
            application/json:
              schema:
                type: object
                required: [replica_id, generated_at, mode, revision, digest, applied_at, checked_at]
                properties:
                  replica_id: {type: string}
                  generated_at: {type: string, format: date-time}
                  mode: {type: string, enum: [file, controlplane]}
                  revision: {type: integer, format: int64, minimum: 0}
                  digest: {type: string}
                  applied_at: {type: string, format: date-time}
                  checked_at: {type: string, format: date-time}
                  error: {type: string}
        "401":
          $ref: "#/components/responses/AdminError"

  /internal/v1/nodes:
    get:
      tags: [admin]
      summary: 本副本当前看到的机群清单
      operationId: getFleetSnapshot
      security:
        - adminToken: []
      responses:
        "200":
          description: 机群快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replica"
        "401":
          $ref: "#/components/responses/AdminError"

  /internal/v1/workflows:
    get:
      tags: [admin]
      summary: 本副本注册的工作流模板目录（未配置模板目录时不挂载此路由）
      operationId: getWorkflowCatalog
      security:
        - adminToken: []
      responses:
        "200":
          description: 模板目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateCatalog"
        "401":
          $ref: "#/components/responses/AdminError"

  /internal/v1/jobs:
    get:
      tags: [admin]
      summary: 本副本上某一个租户的运行列表（未启用前门时不挂载此路由）
      description: tenant_id 为必填查询参数；缺省时返回 400，而不是返回全部租户的运行。
      operationId: getTenantJobs
      security:
        - adminToken: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 该租户在本副本上的运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/AdminError"
        "401":
          $ref: "#/components/responses/AdminError"

  # ---------------------------------------------------------------------------
  # Studio API（/studio/v1）：以 -studio 启动时挂载，只接受控制面会话令牌
  # ---------------------------------------------------------------------------
  /studio/v1/me:
    get:
      tags: [studio]
      summary: 当前会话所属的租户用户
      operationId: studioGetMe
      security:
        - studioSession: []
      responses:
        "200":
          description: 会话身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioMe"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/models:
    get:
      tags: [studio]
      summary: 该用户可对话的模型
      description: |
        与同一租户的 API Key 调用 `GET /v1/models` 得到的模型集合相同（同一模型与节点授权），
        但形状不同：这里是 `{data:[{id,name}]}`，`name` 为展示名，缺省回退为 `id`。
      operationId: studioListModels
      security:
        - studioSession: []
      responses:
        "200":
          description: 模型列表（按目录顺序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioModelList"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/conversations:
    get:
      tags: [studio]
      summary: 列出当前用户的对话
      description: 游标分页，按控制面给出的顺序；`next` 为空（缺省）表示已是最后一页。
      operationId: studioListConversations
      security:
        - studioSession: []
      parameters:
        - name: q
          in: query
          required: false
          description: 标题搜索关键字，原样交给控制面
          schema:
            type: string
        - $ref: "#/components/parameters/StudioCursor"
        - $ref: "#/components/parameters/StudioLimit"
      responses:
        "200":
          description: 一页对话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioConversationPage"
        "400":
          $ref: "#/components/responses/StudioInvalidRequest"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "503":
          $ref: "#/components/responses/StudioUnavailable"
    post:
      tags: [studio]
      summary: 新建对话
      description: |
        请求体可为空（视为 `{}`），未知字段被拒绝（400）。请求体上限 256 KiB（413 `too_large`）。
        标题长度等存储限制由控制面判定，被拒绝时为 400 `invalid_request`。
      operationId: studioCreateConversation
      security:
        - studioSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioConversationCreate"
      responses:
        "201":
          description: 新对话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioConversation"
        "400":
          $ref: "#/components/responses/StudioInvalidRequest"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "409":
          $ref: "#/components/responses/StudioConflict"
        "413":
          $ref: "#/components/responses/StudioTooLarge"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/StudioConversationID"
    get:
      tags: [studio]
      summary: 读取一个对话
      operationId: studioGetConversation
      security:
        - studioSession: []
      responses:
        "200":
          description: 对话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioConversation"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "404":
          $ref: "#/components/responses/StudioNotFound"
        "503":
          $ref: "#/components/responses/StudioUnavailable"
    patch:
      tags: [studio]
      summary: 修改对话的标题、模型或系统提示词
      description: 只修改请求体中出现且非 null 的字段；请求体上限 256 KiB，未知字段被拒绝（400）。
      operationId: studioUpdateConversation
      security:
        - studioSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioConversationPatch"
      responses:
        "200":
          description: 修改后的对话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioConversation"
        "400":
          $ref: "#/components/responses/StudioInvalidRequest"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "404":
          $ref: "#/components/responses/StudioNotFound"
        "409":
          $ref: "#/components/responses/StudioConflict"
        "413":
          $ref: "#/components/responses/StudioTooLarge"
        "503":
          $ref: "#/components/responses/StudioUnavailable"
    delete:
      tags: [studio]
      summary: 删除对话及其消息
      operationId: studioDeleteConversation
      security:
        - studioSession: []
      responses:
        "204":
          description: 已删除（无响应体）
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "404":
          $ref: "#/components/responses/StudioNotFound"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/StudioConversationID"
    get:
      tags: [studio]
      summary: 读取对话的消息历史
      description: |
        按 `seq` 升序返回 `seq > after_seq` 的消息。这里没有 `next` 游标：
        继续翻页时把上一页最后一条的 `seq` 作为 `after_seq`。
      operationId: studioListMessages
      security:
        - studioSession: []
      parameters:
        - name: after_seq
          in: query
          required: false
          description: 只返回 seq 大于该值的消息；缺省为 0。必须是非负整数，否则 400
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 最多返回的条数；缺省、非数字或负数按缺省处理，上限与缺省值由控制面决定
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioMessageList"
        "400":
          $ref: "#/components/responses/StudioInvalidRequest"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "404":
          $ref: "#/components/responses/StudioNotFound"
        "503":
          $ref: "#/components/responses/StudioUnavailable"
    post:
      tags: [studio]
      summary: 发送一条消息并以 SSE 流式接收回复
      description: |
        请求体必须在「发送 `content`」与「`regenerate: true` 重新回答最后一个问题」之间二选一
        （`content` 非空白与 `regenerate` 同时成立或同时不成立都是 400）；`regenerate` 不能与
        `replace_from_message_id` 同用；`replace_from_message_id` 必须是 `msg_` 开头的消息 id，
        表示用 `content` 替换该条用户消息及其之后的所有消息。`model` 必填且必须是
        `GET /studio/v1/models` 当前列出的模型，否则 400 `model_unavailable`。
        请求体上限 256 KiB。

        这是计费请求：账户余额耗尽返回 402 `insufficient_balance`，仅限订阅账户且订阅过期返回
        402 `account_subscription_expired`；管理对话本身不受影响。

        用户一侧的消息先于派发写入，写入失败则不派发。校验与写入通过后响应为
        `200 text/event-stream`，**此后所有失败只出现在流内**（HTTP 状态仍为 200）。帧格式为
        `event: <名称>\ndata: <JSON>\n\n`，顺序为：

        1. `message_start`：`{conversation, user_message, message_id, model}`
        2. 任意多个 `text_delta` / `thinking_delta`：`{delta}`
        3. `usage`（仅当有用量时）：`{prompt_tokens, completion_tokens}`
        4. `error`（仅当回复失败时）：`{code, message}`，code 取值为
           `model_unavailable`、`insufficient_balance`、`account_subscription_expired`、
           `rate_limited`、`timeout`、`invalid_request`、`upstream_error`
        5. `message_stop`：`{message_id, status, error_code?}`，`status` 为
           `complete` / `incomplete`（客户端中途离开或流被截断）/ `error`

        回复在流结束后写入存储；客户端提前断开时，已收到的部分仍以 `incomplete` 保存。
        各帧的载荷见 StudioMessageStartFrame、StudioDeltaFrame、StudioUsage、
        StudioStreamErrorFrame、StudioMessageStopFrame。
      operationId: studioSendMessage
      security:
        - studioSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSendMessageRequest"
      responses:
        "200":
          description: SSE 流，帧序列见操作说明
          content:
            text/event-stream:
              schema:
                description: |
                  `event: message_start | text_delta | thinking_delta | usage | error | message_stop`，
                  每帧 `data:` 为对应事件的 JSON 载荷，依次为下列 schema
                oneOf:
                  - $ref: "#/components/schemas/StudioMessageStartFrame"
                  - $ref: "#/components/schemas/StudioDeltaFrame"
                  - $ref: "#/components/schemas/StudioUsage"
                  - $ref: "#/components/schemas/StudioStreamErrorFrame"
                  - $ref: "#/components/schemas/StudioMessageStopFrame"
        "400":
          $ref: "#/components/responses/StudioInvalidRequest"
        "401":
          $ref: "#/components/responses/StudioUnauthorized"
        "402":
          $ref: "#/components/responses/StudioPaymentRequired"
        "404":
          $ref: "#/components/responses/StudioNotFound"
        "409":
          $ref: "#/components/responses/StudioConflict"
        "413":
          $ref: "#/components/responses/StudioTooLarge"
        "429":
          $ref: "#/components/responses/StudioRateLimited"
        "503":
          $ref: "#/components/responses/StudioUnavailable"

  /studio/v1/flows:
    get:
      tags: [studio]
      summary: 列出当前用户的编排
