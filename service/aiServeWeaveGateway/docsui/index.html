<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="swagger-ui.css">
<style>
body { margin: 0; background: #fafafa; }
.aisw-language { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 20px; font: 15px/1.5 sans-serif; background: #fff; }
.aisw-language select { max-width: 100%; padding: 6px; }
.swagger-ui .parameter__name.required:after { content: var(--aisw-required); }
.swagger-ui .loading-container .loading:after { content: var(--aisw-loading); }
</style>
</head>
<body>
<div class="aisw-language"><label for="aisw-docs-locale" id="aisw-language-label">{{.Language}}</label><select id="aisw-docs-locale">{{range .Options}}<option value="{{.Locale}}"{{if eq .Locale $.Locale}} selected{{end}}>{{.Label}}</option>{{end}}</select><span id="aisw-language-error" role="status"></span></div>
<div id="swagger-ui"></div>
<script id="aisw-docs-state" type="application/json">{{.Bootstrap}}</script>
<script src="swagger-ui-bundle.js"></script>
<script src="swagger-ui-standalone-preset.js"></script>
<script type="module" src="i18n.mjs"></script>
</body>
</html>
