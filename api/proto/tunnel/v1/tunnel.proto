// Package tunnel.v1 is the wire contract of the Agent tunnel: a mTLS gRPC
// link that an Agent behind NAT opens outbound to every Gateway replica, plus
// the Registry service that issues the node identity used by those links.
//
// The tunnel carries runtime semantics, never arbitrary HTTP. Every payload in
// this file mirrors a type of common/runtime, so both sides
// can convert to that package's Go types without inventing a second canonical
// model. Agent and Gateway share this one file and its generated code.
//
// Two rules are load-bearing and must survive any future edit:
//   - No message here carries a credential. RuntimeSpec references an API key
//     by name (api_key_ref) and never by value; RuntimeSnapshot mirrors
//     runtime.Snapshot, which is credential-free by construction.
//   - No message here can express "fetch this URL" or "run this command". The
//     Agent is not a general-purpose proxy, and the protocol deliberately
//     leaves no extension point that would make it one.
syntax = "proto3";

package tunnel.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "AIServeWeave/api/proto/tunnel/v1;tunnelv1";

// -----------------------------------------------------------------------
// Services
// -----------------------------------------------------------------------

// Tunnel is implemented by every Gateway replica; an Agent connects to each
// replica separately, so a request never needs forwarding between replicas.
// Both methods require a valid client certificate, and each replica must
// independently check that the node_id in the certificate SAN matches the
// node_id declared on the stream, closing the stream when they differ.
service Tunnel {
  // Control is the long-lived control plane: heartbeats, status reporting,
  // config delivery, replica roster and graceful drain. Exactly one per
  // (Agent, replica) pair.
  rpc Control(stream AgentControl) returns (stream GatewayControl);

  // Serve is one data-plane slot. The Agent opens it, sends Ready and waits;
  // the Gateway dispatches a request into it. A slot serves one request at a
  // time and may send Ready again to be reused afterwards.
  rpc Serve(stream AgentFrame) returns (stream GatewayFrame);
}

// NodeIdentity is implemented by the Registry alone, never by a Gateway
// replica: one-shot bootstrap token validation needs strongly consistent
// storage, and the CA private key must not be distributed to data-plane
// replicas.
service NodeIdentity {
  // Register exchanges a one-time bootstrap token for a node certificate.
  // This is the only method in the whole contract that does not require a
  // client certificate.
  //
  // A node_id first presented with an unbound bootstrap token, and not
  // already approved by an operator (TokenAdmin.ApproveNode, STATUS.md's
  // P01), is refused: the identity ledger records the attempt as pending
  // approval instead of signing a certificate. A node_id presented with a
  // node_id-bound token skips this gate — minting that token is itself the
  // approval.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // RenewCertificate rotates a node certificate and requires the current
  // certificate to still be valid.
  rpc RenewCertificate(RenewRequest) returns (RenewResponse);
}

// GatewayDirectory is implemented by the Registry alone. Every Gateway
// replica joins it once at startup and keeps the stream open for as long as
// it wants to remain in the roster; the Registry authors GatewayRoster from
// every currently open Join stream and pushes the full roster to all of them
// on any change.
//
// Join is guarded by a static bearer token (STATUS.md's S03), distinct from
// TokenAdmin's: a Gateway replica only needs to prove it is allowed to learn
// and appear in the roster, not to mint or revoke bootstrap tokens or disable
// nodes, so it is handed a narrower credential. A Registry configured with no
// such token leaves Join open, matching the behavior before S03 — the same
// opt-in shape TokenAdmin itself uses for AdminToken.
service GatewayDirectory {
  rpc Join(stream JoinRequest) returns (stream GatewayRoster);
}

// TokenAdmin is implemented by the Registry alone, guarded by a static
// bearer token distinct from any node's mTLS identity (STATUS.md's S02) and
// from GatewayDirectory.Join's own token (STATUS.md's S03). Minting,
// revocation, and node enable/disable all need to observe and update the
// same mutex-guarded state Register itself consumes, which only the process
// holding that mutex can do safely — that is why this replaces direct file
// access to the token store instead of leaving it a CLI-only,
// server-independent tool.
service TokenAdmin {
  // MintToken issues a fresh one-time bootstrap token. A non-empty node_id
  // binds the token to that node identity: Register then treats the bound
  // value as authoritative — overriding whatever node_id the Agent proposes
  // — and applies the resulting identity-ledger update unconditionally, the
  // same way RenewCertificate's own proof of key possession does, because
  // this authenticated mint call is the out-of-band authorization a
  // reinstall needs (see the Registry README's node_id 唯一性 section). An
  // empty node_id mints an unbound token: Register keeps today's behavior,
  // assigning or accepting whatever node_id the Agent proposes and refusing
  // a ledger conflict.
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);

  // RevokeToken guarantees a token can never be consumed, whether or not it
  // already has been: revoking an already-used, already-revoked, or expired
  // token is not an error, since all of those already guarantee the same
  // thing.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // DisableNode marks a node_id as revoked (STATUS.md's S03): Register and
  // RenewCertificate both refuse it from this point on, and the Registry
  // pushes the updated revoked set to every joined Gateway replica on
  // GatewayRoster, which closes that node_id's existing Control stream(s) —
  // the "生效路径" the task asks for, not merely blocking future handshakes.
  // Disabling a node_id that is already disabled, or one that has never
  // registered, is not an error: both already guarantee the node cannot
  // authenticate.
  rpc DisableNode(DisableNodeRequest) returns (DisableNodeResponse);

  // EnableNode clears a prior DisableNode. Enabling a node_id that is not
  // currently disabled is not an error.
  rpc EnableNode(EnableNodeRequest) returns (EnableNodeResponse);

  // ApproveNode clears a node_id's pending-approval mark (STATUS.md's P01),
  // creating a record for it if none exists yet — an operator may approve a
  // node_id before it has ever registered, the same way DisableNode may
  // pre-emptively revoke one. It has no effect on a node_id registered via a
  // node_id-bound bootstrap token: minting that token is itself the approval
  // (see MintToken), so such a node_id is never marked pending in the first
  // place.
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);

  // SetMaintenance marks a node_id as under operator-forced maintenance
  // (STATUS.md's P01): the Registry pushes the updated set to every joined
  // Gateway replica on GatewayRoster, and a replica stops assigning new work
  // to that node_id without closing its existing Control stream or
  // interrupting in-flight requests — unlike DisableNode, this is not an
  // identity revocation. Setting maintenance on a node_id that is already
  // under maintenance is not an error.
  rpc SetMaintenance(SetMaintenanceRequest) returns (SetMaintenanceResponse);

  // ClearMaintenance clears a prior SetMaintenance. Clearing maintenance on a
  // node_id that is not currently under it is not an error.
  rpc ClearMaintenance(ClearMaintenanceRequest) returns (ClearMaintenanceResponse);

  // ListNodeStates reports every node_id the identity ledger has an opinion
  // about — pending approval, disabled, or under maintenance — so a caller
  // building an operator console can render "expected state" without this
  // service exposing its on-disk ledger format directly.
  rpc ListNodeStates(ListNodeStatesRequest) returns (ListNodeStatesResponse);
}

// -----------------------------------------------------------------------
// Node identity
// -----------------------------------------------------------------------

message RegisterRequest {
  // node_id is the Agent's proposed identity. It is required unless
  // bootstrap_token is itself node_id-bound (TokenAdmin.MintToken), in which
  // case the bound value always wins and overrides whatever is set here: an
  // unbound registration can no longer leave this empty for the Registry to
  // assign one (STATUS.md's P01) — an operator approves a node_id by name,
  // and a self-assigned one would have nothing stable to approve.
  string node_id = 1;
  bytes csr = 2;                        // PKCS#10 certificate request, DER
  string bootstrap_token = 3;           // one-time, short-lived, optionally node_id-bound (TokenAdmin.MintToken)
  string agent_version = 4;
}

message RegisterResponse {
  string node_id = 1;                   // authoritative; must match cert SAN
  bytes certificate_pem = 2;
  bytes ca_bundle_pem = 3;
  google.protobuf.Timestamp not_after = 4;
}

message RenewRequest {
  string node_id = 1;
  bytes csr = 2;
}

message RenewResponse {
  bytes certificate_pem = 1;
  bytes ca_bundle_pem = 2;
  google.protobuf.Timestamp not_after = 3;
}

// -----------------------------------------------------------------------
// Token administration
// -----------------------------------------------------------------------

message MintTokenRequest {
  google.protobuf.Duration ttl = 1;
  string node_id = 2;                   // optional; binds the token (see TokenAdmin.MintToken)
}

message MintTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeTokenRequest {
  string token = 1;
}

message RevokeTokenResponse {}

message DisableNodeRequest {
  string node_id = 1;
}

message DisableNodeResponse {}

message EnableNodeRequest {
  string node_id = 1;
}

message EnableNodeResponse {}

message ApproveNodeRequest {
  string node_id = 1;
}

message ApproveNodeResponse {}

message SetMaintenanceRequest {
  string node_id = 1;
}

message SetMaintenanceResponse {}

message ClearMaintenanceRequest {
  string node_id = 1;
}

message ClearMaintenanceResponse {}

message ListNodeStatesRequest {}

message ListNodeStatesResponse {
  repeated NodeState states = 1;
}

// NodeState is one node_id's entry in the identity ledger, as ListNodeStates
// reports it. A node_id absent from this list has no ledger entry at all:
// it has never registered, been pre-approved, pre-disabled, or put under
// maintenance.
message NodeState {
  string node_id = 1;
  // pending_approval is true when this node_id has attempted to register
  // with an unbound bootstrap token but no operator has approved it yet
  // (STATUS.md's P01). Register refuses it while this holds.
  bool pending_approval = 2;
  // disabled mirrors TokenAdmin.DisableNode (STATUS.md's S03).
  bool disabled = 3;
  // maintenance mirrors TokenAdmin.SetMaintenance (STATUS.md's P01).
  bool maintenance = 4;
  google.protobuf.Timestamp first_seen_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
}

// -----------------------------------------------------------------------
// Data plane
// -----------------------------------------------------------------------

// GatewayFrame is one frame from Gateway to Agent on a Serve stream.
message GatewayFrame {
  string request_id = 1;                // trace id, carried on every frame
  oneof body {
    RequestHeaders headers = 2;
    DataChunk data = 3;                 // request body part (artifact upload, workflow input)
    RequestEnd end = 4;
    Cancel cancel = 5;
    Ping ping = 6;                      // application keepalive, separate from gRPC keepalive
  }
}

// AgentFrame is one frame from Agent to Gateway on a Serve stream.
message AgentFrame {
  string request_id = 1;                // empty on Ready and Pong
  oneof body {
    Ready ready = 2;
    ResponseHeaders headers = 3;
    DataChunk data = 4;                 // stream event or artifact part
    ResponseEnd end = 5;
    Pong pong = 6;
  }
}

// Ready parks a slot in the idle pool, waiting for a request.
message Ready {
  string node_id = 1;
  string slot_id = 2;                   // Agent-generated, so both sides' logs line up
  SlotClass class = 3;
}

enum SlotClass {
  SLOT_CLASS_UNSPECIFIED = 0;
  SLOT_CLASS_INFERENCE = 1;             // chat / embed / workflow submit and events
  SLOT_CLASS_BULK = 2;                  // artifact transfer, physically isolated from inference
}

message RequestHeaders {
  string runtime_id = 1;                // must match the Agent's local allowlist
  Operation operation = 2;
  // deadline_unix_ms is an absolute deadline. It is carried in-band because a
  // reused slot outlives any single request, so the gRPC stream deadline
  // cannot express a per-request one. 0 means "no Gateway-supplied deadline";
  // the Agent still applies its local maximum.
  int64 deadline_unix_ms = 3;
  bytes payload = 4;                    // decoded according to operation
  map<string, string> trace = 5;        // fixed key set only, e.g. request_id, tenant_id
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_LIST_MODELS = 1;
  OPERATION_CHAT = 2;
  OPERATION_CHAT_STREAM = 3;
  OPERATION_EMBED = 4;
  OPERATION_WORKFLOW_SUBMIT = 5;
  OPERATION_WORKFLOW_SUBSCRIBE = 6;
  OPERATION_WORKFLOW_STATUS = 7;
  OPERATION_WORKFLOW_CANCEL = 8;
  OPERATION_ARTIFACT_OPEN = 9;
  OPERATION_ARTIFACT_LIST = 10;
  OPERATION_INPUT_UPLOAD = 11;
  OPERATION_AUDIO_TRANSCRIBE = 12;       // transcription and translation share one operation; AudioTranscriptionRequest.task selects
  OPERATION_RERANK = 13;
}

// RequestEnd closes the request-body direction of a slot. Operations whose
// request fits entirely in RequestHeaders.payload still send it, so the Agent
// has one uniform signal that no more input is coming.
message RequestEnd {}

// Cancel asks the Agent to cancel the in-flight request. The Agent must drop a
// Cancel whose request_id does not match the request currently on the slot:
// otherwise a late cancel would kill a new request that reused the slot.
message Cancel {
  string reason = 1;                    // diagnostic only, never interpreted
}

message Ping {
  int64 sent_unix_ms = 1;
}

message Pong {
  int64 sent_unix_ms = 1;               // echoed from the Ping, for RTT
}

// ResponseHeaders precedes the body of an ARTIFACT_OPEN response and is unused
// by every other operation.
message ResponseHeaders {
  string content_type = 1;
  int64 size = 2;                       // -1 when unknown
}

// DataChunk is one piece of a request or response body. On streaming
// operations each chunk holds exactly one event and must be sent as soon as it
// is produced: aggregating chunks is what turns millisecond TTFT into seconds.
message DataChunk {
  bytes payload = 1;
}

// ResponseEnd terminates a request. An unset error means success.
message ResponseEnd {
  TunnelError error = 1;
}

// TunnelError is the wire mirror of runtime.RuntimeError, so an error code,
// its retryable flag and its sanitized message cross the tunnel intact.
message TunnelError {
  string code = 1;                      // runtime.ErrorCode string value
  string runtime_id = 2;
  string kind = 3;
  string operation = 4;
  int32 status_code = 5;                // 0 when not applicable
  string message = 6;                   // already sanitized
  bool retryable = 7;
  // cause names a runtime sentinel error (e.g. "ErrRuntimeNotFound") so the
  // far side can restore it for errors.Is. Only sentinels cross: a
  // non-sentinel cause may hold unsanitized detail and is dropped here.
  string cause = 8;
}

// -----------------------------------------------------------------------
// Control plane
// -----------------------------------------------------------------------

message AgentControl {
  oneof body {
    Hello hello = 1;                    // first frame on the stream
    Heartbeat heartbeat = 2;
    RuntimeStatus status = 3;           // mirror of runtime.Manager.Snapshot()
    Draining draining = 4;              // graceful shutdown notice
    Pong pong = 5;
    ModelPullReport model_pull = 6;     // STATUS.md P2 model distribution subtask 2
    ComfyUIManagedReport comfyui_managed = 7; // STATUS.md P2 ComfyUI Managed Docker deployment subtask 2
    AgentUpgradeReport agent_upgrade = 8; // STATUS.md P2 Agent auto-upgrade subtask 1
  }
}

message GatewayControl {
  oneof body {
    HelloAck ack = 1;
    HeartbeatAck hb_ack = 2;
    RuntimeConfig config = 3;
    SlotHint slot_hint = 4;
    GatewayRoster roster = 5;
    Shutdown shutdown = 6;
    Ping ping = 7;
    ModelPullTrigger model_pull_trigger = 8; // STATUS.md P2 model distribution subtask 2
    ComfyUIManagedAction comfyui_managed_action = 9; // STATUS.md P2 ComfyUI Managed Docker deployment subtask 2
    ComfyUIManagedCustomNodeInstallTrigger comfyui_managed_custom_node_install = 10; // STATUS.md P2 ComfyUI Managed Docker deployment subtask 4
    AgentUpgradeAction agent_upgrade_action = 11; // STATUS.md P2 Agent auto-upgrade subtask 1
  }
}

message Hello {
  string node_id = 1;
  string agent_version = 2;
  NodeResources resources = 3;
  // runtime_ids is the Agent's local allowlist. The Gateway uses it to avoid
  // dispatching to a runtime the Agent would reject anyway; the Agent still
  // enforces the allowlist on every request.
  repeated string runtime_ids = 4;
  // labels are operator-assigned facts about this node — region=local,
  // gpu=4090 — that routing rules select on. They arrive with Hello rather
  // than with the heartbeat because they describe the machine, not its load,
  // and a reconnect is what re-reads them.
  //
  // They are declared by the Agent and taken at face value, so they must never
  // decide authorization: a compromised Agent could claim any label it liked.
  // They express a preference about where work should go, not permission to
  // receive it.
  map<string, string> labels = 5;
}

message NodeResources {
  int32 cpu_cores = 1;
  int64 memory_bytes = 2;
  int32 gpu_count = 3;
  int64 gpu_memory_bytes = 4;
  string os = 5;
  string arch = 6;
}

message HelloAck {
  string replica_id = 1;
  int64 server_unix_ms = 2;
}

message Heartbeat {
  int64 sent_unix_ms = 1;
  int32 inflight_requests = 2;
  int32 idle_slots = 3;
}

message HeartbeatAck {
  int64 sent_unix_ms = 1;               // echoed, for RTT
  int64 server_unix_ms = 2;
}

// Draining tells the replica the Agent is shutting down: stop dispatching, let
// in-flight requests finish.
message Draining {
  string reason = 1;
  int64 deadline_unix_ms = 2;
}

// Shutdown asks the Agent to drain and disconnect from this replica.
message Shutdown {
  string reason = 1;
  google.protobuf.Duration grace_period = 2;
}

// SlotHint suggests slot watermarks for this replica. It is advice: the Agent
// clamps it to its locally configured limits.
message SlotHint {
  int32 min_slots = 1;
  int32 max_slots = 2;
  int32 bulk_slots = 3;
}

// GatewayRoster is the authoritative list of Gateway replicas, maintained by
// the Registry and broadcast by every replica on its own Control stream. The
// Agent opens and closes tunnels to match it.
message GatewayRoster {
  repeated GatewayReplica replicas = 1;
  int64 version = 2;                    // monotonic; the Agent ignores older versions
  // revoked_node_ids is the full current set of disabled node_ids
  // (TokenAdmin.DisableNode, STATUS.md's S03), broadcast on every change the
  // same way the replica list itself is. A Gateway replica diffs this against
  // what it knew before and forcibly closes the Control stream of any node_id
  // that just became revoked, instead of waiting for that node to reconnect
  // and be refused.
  repeated string revoked_node_ids = 3;
  // maintenance_node_ids is the full current set of node_ids under
  // operator-forced maintenance (TokenAdmin.SetMaintenance, STATUS.md's
  // P01), broadcast the same way revoked_node_ids is. Unlike a revoked
  // node_id, a maintenance node_id's existing Control stream is left alone:
  // a replica diffs this set and stops assigning new work to the node
  // without disconnecting it.
  repeated string maintenance_node_ids = 4;
}

message GatewayReplica {
  string replica_id = 1;
  string endpoint = 2;                  // host:port, must be directly dialable by the Agent
  ReplicaState state = 3;
}

enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  REPLICA_STATE_ACTIVE = 1;             // dispatching normally, keep connected
  REPLICA_STATE_DRAINING = 2;           // no new requests: stop refilling slots, let in-flight finish
  REPLICA_STATE_REMOVED = 3;            // gone, close the tunnel
}

// JoinRequest reports one Gateway replica's own endpoint and state to the
// Registry on a GatewayDirectory.Join stream. replica_id and endpoint are
// read from the first message only; a later message on the same stream needs
// only set state, e.g. DRAINING right before a graceful shutdown so Agents
// that have not yet connected to this replica know not to bother.
message JoinRequest {
  string replica_id = 1;
  string endpoint = 2;
  ReplicaState state = 3;
}

// RuntimeStatus mirrors runtime.Manager.Snapshot(). It is reported on change
// and re-sent in full periodically to reconcile. The same snapshot goes to
// every replica, since it comes from one Manager.
message RuntimeStatus {
  repeated RuntimeSnapshot snapshots = 1;
  // full marks a periodic reconciliation carrying every instance, as opposed
  // to a change-triggered report.
  bool full = 2;
  google.protobuf.Timestamp reported_at = 3;
}

// RuntimeConfig delivers one runtime configuration change. Success or failure
// is observed through the next RuntimeStatus rather than a dedicated ack.
message RuntimeConfig {
  ConfigAction action = 1;
  string runtime_id = 2;                // the only field REMOVE needs
  RuntimeSpec spec = 3;                 // unset for REMOVE
}

enum ConfigAction {
  CONFIG_ACTION_UNSPECIFIED = 0;
  CONFIG_ACTION_ADD = 1;
  CONFIG_ACTION_REPLACE = 2;
  CONFIG_ACTION_REMOVE = 3;
}

// ModelPullTrigger asks the Agent to start pulling model artifacts it
// already knows about from its local manifest (STATUS.md's P2 model
// distribution subtask 1), referenced only by name. It can never carry a
// URL or any other fetch instruction: the load-bearing rule at the top of
// this file forbids a message that expresses "fetch this URL", and a
// replica whose trust were compromised must not be able to hand the Agent
// an arbitrary source.
//
// ModelPullTrigger 要求 Agent 开始拉取它本地清单（STATUS.md P2 模型分发子
// 任务一）里已经认识的制品，只按名字引用。它永远不能携带 URL 或任何其他取
// 数指令：本文件头部的 load-bearing 规则禁止表达"fetch this URL"的消息，一
// 个信任被攻破的副本不能借此让 Agent 访问任意来源。
message ModelPullTrigger {
  repeated string names = 1;
}

// ModelPullReport mirrors the Agent-local Puller's current status for every
// name it knows about — every entry in its local manifest, whether or not a
// ModelPullTrigger has ever named it. It carries no source URL, matching
// ModelPullTrigger's restriction in the other direction, and no raw error
// text: ModelPullStatus.reason is a closed vocabulary so a transport error
// that happens to embed spec.SourceURL (a presigned URL can carry a
// signature token in its query string) never crosses the tunnel.
//
// ModelPullReport 镜像 Agent 本地 Puller 当前已知的每一个名字的状态——本地
// 清单里的每一条，无论 ModelPullTrigger 是否点过它的名。它不携带来源
// URL，与 ModelPullTrigger 在另一个方向上的限制对称；也不携带原始错误文
// 本：ModelPullStatus.reason 是封闭词表，这样一个恰好把 spec.SourceURL
// （预签名 URL 的查询串可能带签名 token）编进错误文本的传输错误，永远不
// 会跨越隧道。
message ModelPullReport {
  repeated ModelPullStatus pulls = 1;
}

enum ModelPullState {
  MODEL_PULL_STATE_UNSPECIFIED = 0;   // known to the manifest, never triggered
  MODEL_PULL_STATE_PENDING = 1;       // queued behind another in-flight pull
  MODEL_PULL_STATE_DOWNLOADING = 2;
  MODEL_PULL_STATE_DONE = 3;
  MODEL_PULL_STATE_FAILED = 4;
}

enum ModelPullFailureReason {
  MODEL_PULL_FAILURE_REASON_UNSPECIFIED = 0;
  MODEL_PULL_FAILURE_REASON_UNKNOWN_NAME = 1;        // not in the Agent's local manifest
  MODEL_PULL_FAILURE_REASON_INVALID_SPEC = 2;        // manifest entry itself malformed
  MODEL_PULL_FAILURE_REASON_NOT_ALLOWLISTED = 3;     // source_url outside -model-pull-allowlist
  MODEL_PULL_FAILURE_REASON_QUOTA_EXCEEDED = 4;
  MODEL_PULL_FAILURE_REASON_FETCH_FAILED = 5;        // transport error, detail stays in the Agent's own log
  MODEL_PULL_FAILURE_REASON_UNEXPECTED_STATUS = 6;   // non-200/206 HTTP response
  MODEL_PULL_FAILURE_REASON_CHECKSUM_MISMATCH = 7;
  MODEL_PULL_FAILURE_REASON_STORAGE_ERROR = 8;       // local disk write/rename failure
  MODEL_PULL_FAILURE_REASON_OLLAMA_UNCONFIGURED = 9; // kind=ollama spec, no -ollama-url configured
  MODEL_PULL_FAILURE_REASON_OLLAMA_PULL_FAILED = 10; // the Ollama server itself reported an error
  MODEL_PULL_FAILURE_REASON_LEDGER_QUOTA_EXCEEDED = 11; // cross-restart cumulative ledger has no room left
  MODEL_PULL_FAILURE_REASON_DISK_SPACE_LOW = 12;        // target filesystem free space below the configured margin
}

message ModelPullStatus {
  string name = 1;
  ModelPullState state = 2;
  int64 bytes_downloaded = 3;
  int64 bytes_total = 4;                 // 0 when unknown (Spec.SizeBytes was 0)
  ModelPullFailureReason reason = 5;     // set only when state == FAILED
  int64 updated_unix_ms = 6;
}

// ComfyUIManagedAction asks the Agent to apply a lifecycle action to the one
// Managed ComfyUI instance it already declared via its own local flags
// (STATUS.md's P2 ComfyUI Managed Docker deployment, subtask one). It never
// carries an image, mount path, or any other spec field — those stay
// entirely local to the Agent, the same load-bearing reason ModelPullTrigger
// never carries a URL: an operator who wants a new image version pinned
// still edits this node's own flags and triggers RESTART, never hands the
// image name to the Gateway to relay.
//
// ComfyUIManagedAction 要求 Agent 对它已经通过本地 flag 声明的那一个 Managed
// ComfyUI 实例（STATUS.md 的 P2 ComfyUI Managed Docker 部署子任务一）施加一个
// 生命周期动作。它永远不携带镜像名、挂载路径或任何其他 spec 字段——这些完全
// 留在 Agent 本地，与 ModelPullTrigger 从不携带 URL 是同一条 load-bearing 理
// 由：运维想固定新的镜像版本，仍然要改本节点自己的 flag 再触发 RESTART，从不
// 是把镜像名交给 Gateway 转发。
message ComfyUIManagedAction {
  ComfyUIManagedActionType action = 1;
}

enum ComfyUIManagedActionType {
  COMFYUI_MANAGED_ACTION_UNSPECIFIED = 0;
  COMFYUI_MANAGED_ACTION_START = 1;
  COMFYUI_MANAGED_ACTION_STOP = 2;
  COMFYUI_MANAGED_ACTION_RESTART = 3;
}

// ComfyUIManagedReport mirrors the Agent-local Supervisor's current view of
// its one Managed ComfyUI container: empty when Managed mode is disabled on
// this Agent. It reports container-lifecycle state only — ComfyUI protocol
// health for an already-registered instance keeps flowing through the
// existing RuntimeStatus/RuntimeSnapshot path (runtime.Manager.Add
// registers a Managed instance exactly like an External one); this message
// covers only the gap RuntimeStatus cannot see: before the container is
// ever registered, or after it has been deregistered.
//
// ComfyUIManagedReport 镜像 Agent 本地 Supervisor 对它那一个 Managed ComfyUI
// 容器的当前视图：本 Agent 未启用 Managed 模式时为空。它只报告容器生命周期状
// 态——一个已注册实例的 ComfyUI 协议健康状况仍然经既有的
// RuntimeStatus/RuntimeSnapshot 通道汇报（runtime.Manager.Add 注册 Managed
// 实例的方式与 External 实例完全相同）；这条消息只覆盖 RuntimeStatus 看不到
// 的空档：容器从未被注册之前，或被取消注册之后。
message ComfyUIManagedReport {
  repeated ComfyUIManagedStatus instances = 1;
}

message ComfyUIManagedStatus {
  string container_name = 1;
  ComfyUIManagedState state = 2;
  int64 updated_unix_ms = 3;
  repeated ComfyUIManagedCustomNode custom_nodes = 4; // STATUS.md P2 ComfyUI Managed Docker deployment subtask 4
}

enum ComfyUIManagedState {
  COMFYUI_MANAGED_STATE_UNSPECIFIED = 0;
  COMFYUI_MANAGED_STATE_PENDING = 1;
  COMFYUI_MANAGED_STATE_STARTING = 2;
  COMFYUI_MANAGED_STATE_RUNNING = 3;
  COMFYUI_MANAGED_STATE_STOPPED = 4;
  COMFYUI_MANAGED_STATE_FAILED = 5;
}

// ComfyUIManagedCustomNodeInstallTrigger asks the Agent to install one
// custom node it already knows about from its local allowlist (STATUS.md's
// P2 ComfyUI Managed Docker deployment, subtask 4), referenced only by
// name. It can never carry a git repository URL: the load-bearing rule at
// the top of this file forbids a message that expresses "fetch this URL",
// the same reason ModelPullTrigger never carries one.
//
// ComfyUIManagedCustomNodeInstallTrigger 要求 Agent 安装它本地允许列表
// （STATUS.md 的 P2 ComfyUI Managed Docker 部署子任务四）里已经认识的一个
// 自定义节点，只按名字引用。它永远不能携带 git 仓库 URL：本文件头部的
// load-bearing 规则禁止表达"fetch this URL"的消息，与 ModelPullTrigger 从不
// 携带 URL 同一条理由。
message ComfyUIManagedCustomNodeInstallTrigger {
  string name = 1;
}

// AgentUpgradeAction asks the Agent to CHECK, UPGRADE, or ROLLBACK against a
// version it already knows about from its local manifest (STATUS.md's P2
// Agent auto-upgrade), referenced only by version string. It can never
// carry a download URL, a signature, or anything else that would let it be
// read as "fetch this URL" or "run this command": the load-bearing rule at
// the top of this file forbids both, and this message's eventual payload is
// code that will be exec'd, which makes that rule harder here than for
// ModelPullTrigger or ComfyUIManagedAction — the Agent resolves
// target_version against its own manifest (download URL, SHA256, and the
// manifest-wide signature all stay local) and never asks the Gateway or
// control plane where to fetch anything. Subtask 1 implemented CHECK only;
// subtask 2 adds UPGRADE's full chain (download, verify, drain, self-exec).
// ROLLBACK is still accepted on the wire but always answered with
// FAILED/NOT_IMPLEMENTED until a later subtask.
//
// AgentUpgradeAction 要求 Agent 针对它本地清单（STATUS.md 的 P2 Agent 自动
// 升级）里已经认识的一个版本执行 CHECK、UPGRADE 或 ROLLBACK，只按版本号引
// 用。它永远不能携带下载 URL、签名或任何可能被读作"fetch this URL"或"run
// this command"的字段：本文件头部的 load-bearing 规则同时禁止这两者，而这
// 条消息最终的载荷是会被 exec 的代码本身，这让这条规则在这里比
// ModelPullTrigger 或 ComfyUIManagedAction 更硬——Agent 自己拿 target_version
// 去对本地清单解析（下载 URL、SHA256、整份清单的签名都留在本地），从不向
// Gateway 或控制面询问该去哪里获取。子任务一只实现了 CHECK；子任务二补上
// UPGRADE 的完整链路（下载、校验、排空、自我替换）。ROLLBACK 在协议上仍被
// 接受，但要到后续子任务前都只会得到 FAILED/NOT_IMPLEMENTED 的回答。
message AgentUpgradeAction {
  AgentUpgradeActionType action = 1;
  // target_version must name an entry in the Agent's local manifest for
  // UPGRADE/ROLLBACK; it may be empty for CHECK.
  string target_version = 2;
}

enum AgentUpgradeActionType {
  AGENT_UPGRADE_ACTION_UNSPECIFIED = 0;
  AGENT_UPGRADE_ACTION_CHECK = 1;
  AGENT_UPGRADE_ACTION_UPGRADE = 2;
  AGENT_UPGRADE_ACTION_ROLLBACK = 3;
}

// AgentUpgradeReport mirrors the Agent-local Checker's current view of its
// own upgrade process. Unlike ModelPullReport or ComfyUIManagedReport this
// is a single status, not a repeated field: an Agent has exactly one
// running version, not one per named thing.
//
// AgentUpgradeReport 镜像 Agent 本地 Checker 对自己升级流程的当前视图。与
// ModelPullReport 或 ComfyUIManagedReport 不同，这是单个状态而不是
// repeated 字段：一个 Agent 只有一个正在运行的版本，不是按名字各一份。
message AgentUpgradeReport {
  string current_version = 1;
  AgentUpgradeState state = 2;
  AgentUpgradeFailureReason reason = 3; // set only when state == FAILED
  int64 updated_unix_ms = 4;
}

enum AgentUpgradeState {
  AGENT_UPGRADE_STATE_UNSPECIFIED = 0; // maps to StateIdle
  AGENT_UPGRADE_STATE_CHECKING = 1;
  AGENT_UPGRADE_STATE_DOWNLOADING = 2;
  AGENT_UPGRADE_STATE_VERIFYING = 3;
  AGENT_UPGRADE_STATE_DRAINING = 4;
  AGENT_UPGRADE_STATE_RESTARTING = 5; // reported just before exec; a successful exec never reports again, it replaces this process
  AGENT_UPGRADE_STATE_FAILED = 6;
}

enum AgentUpgradeFailureReason {
  AGENT_UPGRADE_FAILURE_REASON_UNSPECIFIED = 0;
  AGENT_UPGRADE_FAILURE_REASON_UNKNOWN_VERSION = 1;    // target_version not in the Agent's local manifest
  AGENT_UPGRADE_FAILURE_REASON_NOT_IMPLEMENTED = 2;    // action is ROLLBACK, which has no execution path yet
  AGENT_UPGRADE_FAILURE_REASON_DOWNLOAD_FAILED = 3;    // fetching or storing the binary failed; raw error text never leaves the Agent
  AGENT_UPGRADE_FAILURE_REASON_VERIFICATION_FAILED = 4; // downloaded bytes' SHA256 does not match the signed manifest entry
  AGENT_UPGRADE_FAILURE_REASON_EXEC_FAILED = 5;        // syscall.Exec itself failed; the old process is still running
}

// ComfyUIManagedCustomNode is one custom node this Agent found installed
// under its Managed container's custom-nodes directory, as read back from
// the container rather than from the allowlist that named it.
//
// ComfyUIManagedCustomNode 是本 Agent 在其 Managed 容器自定义节点目录下发现
// 的一个已安装节点，是从容器里读回的，而不是来自点名它的允许列表。
message ComfyUIManagedCustomNode {
  string name = 1;
  string version = 2;
}

// RuntimeSpec mirrors runtime.Config with one deliberate difference: there is
// no api_key field. The control plane names a secret, the Agent resolves it
// locally, and a compromised Gateway therefore learns no credentials.
message RuntimeSpec {
  string id = 1;
  string kind = 2;
  string base_url = 3;
  string api_key_ref = 4;               // secret name, never a secret value
  map<string, string> headers = 5;
  google.protobuf.Duration probe_timeout = 6;
  google.protobuf.Duration request_timeout = 7;
  google.protobuf.Duration stream_idle_timeout = 8;
  google.protobuf.Duration health_interval = 9;
  google.protobuf.Duration discovery_interval = 10;
  int64 max_concurrent = 11;
  TLSSpec tls = 12;
  map<string, string> capability_overrides = 13;  // capability -> support level
  bool exclusive = 14;
}

message TLSSpec {
  string ca_file = 1;
  string server_name = 2;
  bool insecure_skip_verify = 3;
}

// -----------------------------------------------------------------------
// runtime type mirrors
// -----------------------------------------------------------------------

// RuntimeSnapshot mirrors runtime.Snapshot. It is credential-free by
// construction, which is what makes it safe to report to every replica.
message RuntimeSnapshot {
  RuntimeDescriptor descriptor = 1;
  string state = 2;
  ProbeResult probe = 3;
  HealthReport health = 4;
  Discovery discovery = 5;
  int64 inflight = 6;
  repeated string degraded = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message RuntimeDescriptor {
  string id = 1;
  string kind = 2;
  string base_url = 3;
  int64 max_concurrent = 4;
  bool exclusive = 5;
}

message ProbeResult {
  string kind = 1;
  string version = 2;
  bool identity_verified = 3;
  string evidence = 4;
  google.protobuf.Timestamp probed_at = 5;
}

message HealthReport {
  string state = 1;
  google.protobuf.Duration latency = 2;
  google.protobuf.Timestamp checked_at = 3;
  string error_summary = 4;             // already sanitized
  // queue_running/queue_pending are ComfyUI-only occupancy signals (STATUS.md's
  // P2 realtime-utilization subtask); every other runtime kind leaves both 0,
  // which the scheduler must treat the same as "not reported", not "confirmed
  // idle".
  int32 queue_running = 5;
  int32 queue_pending = 6;
}

message Discovery {
  string version = 1;
  repeated Model models = 2;
  repeated string node_types = 3;
  map<string, CapabilityEvidence> capabilities = 4;
  repeated string warnings = 5;
  google.protobuf.Timestamp discovered_at = 6;
}

message CapabilityEvidence {
  string capability = 1;
  string level = 2;                     // unknown | supported | unsupported
  string source = 3;
  string detail = 4;
}

message Model {
  string id = 1;
  map<string, CapabilityEvidence> capabilities = 2;
}

// ModelList is the LIST_MODELS response payload; protobuf has no top-level
// repeated field, so the slice needs an envelope.
message ModelList {
  repeated Model models = 1;
}

message ChatRequest {
  string model = 1;
  repeated ChatMessage messages = 2;

  // Sampling parameters use proto3 presence for the same reason the Go type
  // uses pointers: "unset" and "explicitly zero" are different requests, and
  // an explicit zero must reach the backend unchanged.
  optional double temperature = 3;
  optional double top_p = 4;
  optional int64 max_tokens = 5;
  repeated string stop = 6;
  optional int64 seed = 7;

  repeated Tool tools = 8;
  string tool_choice = 9;
  ResponseFormat response_format = 10;

  // extra forwards backend-private parameters verbatim; each value is a raw
  // JSON document.
  map<string, bytes> extra = 11;
}

message ChatMessage {
  string role = 1;
  string content = 2;
  string name = 3;
  string tool_call_id = 4;
  repeated ToolCall tool_calls = 5;

  // content_parts carries a multi-part message body (text mixed with
  // images) for the vision-capable OpenAI-compatible content-array shape
  // (STATUS.md's P2 ChatMessage.Content structured rework). Empty for a
  // text-only message, which stays in content above — the two are never
  // both non-empty on the same message.
  repeated ContentPart content_parts = 6;
}

// ContentPart is one piece of ChatMessage.content_parts: a text run, an
// image reference, an inline audio payload, or an inline file/document
// reference.
message ContentPart {
  string type = 1;                      // "text", "image_url", "input_audio", or "file"
  string text = 2;                      // set when type == "text"
  ContentImageURL image_url = 3;        // set when type == "image_url"
  ContentAudio input_audio = 4;         // set when type == "input_audio"
  ContentFile file = 5;                 // set when type == "file"
}

// ContentImageURL is an image content part's source. url may be an http(s)
// URL or a data: URI carrying inline base64 image bytes; this contract does
// not distinguish them, the backend does.
message ContentImageURL {
  string url = 1;
  string detail = 2;                    // optional: "auto" | "low" | "high"
}

// ContentAudio is an "input_audio" content part's inline payload: base64
// bytes plus a format string, mirroring OpenAI's own input_audio shape.
message ContentAudio {
  string data = 1;
  string format = 2;                    // e.g. "wav" or "mp3"
}

// ContentFile is a "file" content part's source: an inline document. url may
// be an http(s) URL or a data: URI, the same convention as
// ContentImageURL.url.
message ContentFile {
  string url = 1;
  string filename = 2;                  // optional
}

message ToolCall {
  string id = 1;
  string type = 2;
  FunctionCall function = 3;
}

message FunctionCall {
  string name = 1;
  string arguments = 2;
}

message Tool {
  string type = 1;                      // currently always "function"
  FunctionDefinition function = 2;
}

message FunctionDefinition {
  string name = 1;
  string description = 2;
  bytes parameters = 3;                 // JSON Schema, passed through verbatim
}

message ResponseFormat {
  string type = 1;                      // text | json_object | json_schema
  JSONSchemaFormat json_schema = 2;     // set only when type == "json_schema"
}

message JSONSchemaFormat {
  string name = 1;
  bool strict = 2;
  bytes schema = 3;                     // raw JSON
}

message ChatResponse {
  string id = 1;
  string model = 2;
  ChatMessage message = 3;
  string finish_reason = 4;
  Usage usage = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ChatEvent {
  string id = 1;
  string model = 2;
  ChatMessageDelta delta = 3;
  string finish_reason = 4;
  Usage usage = 5;                      // unset on all but the final event
}

message ChatMessageDelta {
  string role = 1;
  string content = 2;
  repeated ToolCallDelta tool_calls = 3;
}

message ToolCallDelta {
  int64 index = 1;
  string id = 2;
  string type = 3;
  FunctionCallDelta function = 4;
}

message FunctionCallDelta {
  string name = 1;
  string arguments = 2;
}

message Usage {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
}

message EmbeddingRequest {
  string model = 1;
  repeated string input = 2;
  optional int64 dimensions = 3;
}

message EmbeddingResponse {
  string model = 1;
  repeated Embedding data = 2;
  Usage usage = 3;
}

message Embedding {
  int64 index = 1;
  repeated float vector = 2;
}

// WorkflowRequest mirrors runtime.WorkflowRequest minus the template: workflow
// templates are large enough to threaten the frame size limit, so they travel
// as DataChunks rather than inside RequestHeaders.
message WorkflowRequest {
  string client_id = 1;
  string idempotency_key = 2;
}

message WorkflowRun {
  string id = 1;
  string runtime_id = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

// RunRef is the request payload of the operations that identify a run by id:
// WORKFLOW_SUBSCRIBE, WORKFLOW_STATUS and WORKFLOW_CANCEL.
message RunRef {
  string run_id = 1;
}

message WorkflowEvent {
  string type = 1;
  string run_id = 2;
  string node_id = 3;
  bytes raw = 4;                        // size-limited, unparsed backend payload
  google.protobuf.Timestamp received_at = 5;
}

message WorkflowStatus {
  string state = 1;
  int64 queue_position = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string error_summary = 5;             // already sanitized
  bool out_of_memory = 6;               // only ever true alongside state == "failed"
}

message ArtifactRef {
  string run_id = 1;
  string filename = 2;
  string subfolder = 3;
  string type = 4;
}

// ArtifactList is the ARTIFACT_LIST response payload: which artifacts a
// finished run produced, without any of their bytes. Protobuf has no top-level
// repeated field, so the slice needs an envelope, the same way ModelList wraps
// LIST_MODELS.
//
// Listing is a separate operation from ARTIFACT_OPEN because the two have
// nothing in common at the transport layer: this one is a small, bounded reply
// on an inference slot, while opening an artifact streams an unbounded body on
// a bulk slot.
message ArtifactList {
  repeated ArtifactRef artifacts = 1;
}

// InputUploadRequest is the OPERATION_INPUT_UPLOAD request payload's
// metadata (STATUS.md's P04, the input-upload half of "文件与产物"). The
// bytes themselves follow as DataChunks and RequestEnd closes them, the same
// "headers then DataChunks then RequestEnd" shape WORKFLOW_SUBMIT already
// uses for a body too large to fit in RequestHeaders.payload — reused here
// rather than inventing a second framing for request bodies.
//
// This message deliberately carries no destination beyond filename/subfolder:
// where the bytes land on disk is decided entirely by the runtime adapter
// that receives them (e.g. common/runtime/workflow/comfyui forwarding to
// ComfyUI's own /upload/image), never by a path or URL named here — the same
// "no message here can express fetch this URL" rule this file's header
// states for every other operation.
message InputUploadRequest {
  string filename = 1;                  // caller-supplied name; never interpreted as a filesystem path
  string subfolder = 2;                 // optional backend-specific subfolder, e.g. ComfyUI's input subfolders
  int64 size = 3;                       // exact byte count the DataChunks will carry; -1 if unknown
  string sha256 = 4;                    // optional integrity check computed by the caller before sending, hex-encoded; empty if not computed
}

// InputUploadResult is the OPERATION_INPUT_UPLOAD response payload.
message InputUploadResult {
  // input_ref is an opaque handle a later WORKFLOW_SUBMIT's template can
  // reference (e.g. the filename ComfyUI's own /upload/image assigned,
  // which may differ from the requested filename on a collision). It is
  // meaningful only to the runtime adapter that produced it.
  string input_ref = 1;
}

// AudioTranscriptionRequest is the OPERATION_AUDIO_TRANSCRIBE request
// payload's metadata (STATUS.md's P2). Like InputUploadRequest, it carries
// no audio bytes: they follow as DataChunks and RequestEnd closes them, the
// same framing WORKFLOW_SUBMIT and INPUT_UPLOAD already use for a body too
// large for RequestHeaders.payload.
message AudioTranscriptionRequest {
  string model = 1;
  string filename = 2;                  // caller-supplied name; never interpreted as a filesystem path
  AudioTask task = 3;
  optional string language = 4;         // meaningful only for AUDIO_TASK_TRANSCRIBE
  optional string prompt = 5;
  optional double temperature = 6;
  string response_format = 7;           // "text" or "json"; empty means "json"
}

// AudioTask selects which of the two OpenAI-compatible audio endpoints a
// AudioTranscriptionRequest targets.
enum AudioTask {
  AUDIO_TASK_UNSPECIFIED = 0;
  AUDIO_TASK_TRANSCRIBE = 1;
  AUDIO_TASK_TRANSLATE = 2;
}

// AudioTranscriptionResponse is the OPERATION_AUDIO_TRANSCRIBE response
// payload. language and duration are best-effort: a backend that does not
// report them leaves both absent.
message AudioTranscriptionResponse {
  string text = 1;
  string language = 2;
  optional double duration = 3;
}

// RerankRequest is the OPERATION_RERANK request payload (STATUS.md's P2).
message RerankRequest {
  string model = 1;
  string query = 2;
  repeated string documents = 3;
  optional int64 top_n = 4;
}

message RerankResponse {
  string model = 1;
  repeated RerankResult results = 2;
}

// RerankResult scores one document from the request's documents list.
// index is that document's position in the request, not a rank.
message RerankResult {
  int64 index = 1;
  double score = 2;
}
