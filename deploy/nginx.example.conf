# AIServeWeave 反向代理示例（Nginx ≥ 1.25.1；default_server 的 ssl_reject_handshake 需要 ≥ 1.19.4）
#
# 放到 /etc/nginx/conf.d/aiserveweave.conf。此文件被 nginx.conf 的 http {} 引入，
# 所以 http 级指令（日志格式、TLS 会话、真实 IP）也写在这里；nginx.conf 中不要重复设置
# 同名指令（ssl_session_cache 等重复会导致 nginx -t 失败）。
# 修改后务必 nginx -t && systemctl reload nginx；未 reload 时正在运行的进程仍使用旧配置。
#
# 示例拓扑（以 open7x.com 为例，换成实际域名）：
#   open7x.com / www  -> Console :3000（/agent/ -> Gateway :8080）  Cloudflare 代理（橙色云）
#   api.open7x.com    -> Gateway :8080                             仅 DNS（灰色云）
#   registry / agent  -> Registry :9443 / Gateway 隧道 :8443         仅 DNS，不经过 Nginx
#
# api 使用仅 DNS 的原因：Cloudflare 代理在 Free/Pro 方案限制请求体 100 MB
# （Gateway 工作流上传上限 200 MiB），且源站 100 秒内未返回响应头即返回 524，
# 非 Enterprise 方案无法调整。仅 DNS 时客户端直连源站，必须使用公开受信的证书
# （例如 acme.sh + Let's Encrypt DNS-01），Cloudflare Origin CA 证书只受 Cloudflare 信任。
# 证书申请与切换步骤见 deploy/README.md「HTTPS 反向代理」。
#
# nginx.conf 的 main / events 部分建议同时调整（SSE 长连接每条占用客户端与上游两个连接）：
#   worker_rlimit_nofile 65535;
#   events { worker_connections 8192; }
#
# Cloudflare 侧（橙色云的站点）：SSL/TLS 模式 Full (strict)；关闭 Bot Fight Mode
# （会拦截 curl 一行命令安装）、Rocket Loader 与 Email Address Obfuscation（干扰 Next.js）。

# ---------- http 级设置 ----------

server_tokens off;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# 记录耗时与 Cloudflare Ray ID，便于区分慢在 Nginx 还是后端，并与 Cloudflare 日志对照。
log_format aisw '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time urt=$upstream_response_time cf_ray=$http_cf_ray';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 端口对应 .env 的 CONSOLE_PORT / GATEWAY_PORT。keepalive 复用到后端的连接，
# 需配合 proxy_http_version 1.1 与不为 close 的 Connection 头。
upstream console_backend { server 127.0.0.1:3000; keepalive 32; }
upstream gateway_backend { server 127.0.0.1:8080; keepalive 64; }

# 从 Cloudflare 回源时还原访客真实 IP。只信任以下网段，直连源站伪造的头不会生效。
# 仅 DNS 的 api 直连时 $remote_addr 本身就是真实 IP。
# 网段列表来自 https://www.cloudflare.com/ips/ ，会不定期更新，需定期对照。
# 注意：控制面审计只记录 RemoteAddr、不采信转发头，这里的真实 IP 目前只体现在 Nginx 日志中。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---------- 默认站点：拒绝未知 Host / 直接 IP 访问 ----------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# ---------- HTTP -> HTTPS ----------

server {
    listen 80;
    listen [::]:80;
    server_name open7x.com www.open7x.com api.open7x.com;
    return 301 https://$host$request_uri;
}

# ---------- Console（Cloudflare 代理） ----------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name open7x.com www.open7x.com;

    # 经 Cloudflare 代理时可使用 Cloudflare Origin CA 证书。
    ssl_certificate     /etc/nginx/ssl/open7x.com.pem;
    ssl_certificate_key /etc/nginx/ssl/open7x.com.key;

    # 可选：开启 Cloudflare Authenticated Origin Pulls，只接受 Cloudflare 回源。
    # 只影响本 server 块，不影响仅 DNS 的 api。证书下载自 Cloudflare 文档。
    # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/nginx/access.log aisw;

    client_max_body_size 100m;

    # 一行命令安装的公开入口（需 .env 设置 AGENT_PUBLIC_URL）。不带 Cookie，
    # 不要并入 Console 的 location，也不要加登录校验。安装脚本、清单与制品均返回
    # Cache-Control: no-store，Cloudflare 不会缓存。
    location /agent/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;          # 制品较大，不落盘缓冲
        client_max_body_size 4k;      # 兑换请求体不超过 1 KiB
    }

    location / {
        proxy_pass http://console_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;     # 必须原样透传，否则写操作会被同源检查拒绝
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ---------- Gateway API（仅 DNS） ----------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.open7x.com;

    # 客户端直连，必须是公开受信证书，并使用完整证书链（fullchain）。
    # acme.sh --install-cert ... --fullchain-file 安装到此路径，续期后由 --reloadcmd 自动 reload。
    ssl_certificate     /etc/nginx/ssl/api.open7x.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.open7x.com.key;

    access_log /var/log/nginx/access.log aisw;

    # 与 Gateway 工作流上传上限 MaxWorkflowUploadBytes（200 MiB）一致。
    # 若 api 改走 Cloudflare 代理，实际上限受 Cloudflare 方案限制（Free/Pro 为 100 MB）。
    client_max_body_size 200m;

    location / {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        proxy_buffering         off;   # SSE 流式响应逐条转发
        proxy_cache             off;
        proxy_request_buffering off;   # 大文件上传直接流给 Gateway

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
