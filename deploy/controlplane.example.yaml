# aiserveweave-controlplane configuration, for the Docker Compose stack.
#
# Container hostnames and MySQL Job persistence are configured here.
# 此配置使用容器主机名，并选择支持 Job 持久化的 MySQL。
#
# 三个密钥从环境变量注入，本文件里没有任何一个的取值。
# 用 `openssl rand -base64 32` 各生成一个独立的值再 export。
#
# 三个密钥写成 ${VAR}：conf.UseEnv 会展开它们，未设置时展开为空串，而 Validate
# 要求至少 32 字符，因此忘记注入的部署会带着一条可操作的报错启动失败——而不是
# 带着一个提交在仓库里、人人可见的占位符继续跑下去。
#
# The three secrets are injected from the environment; no value for any of them
# lives in this file. Generate an independent value for each with
# `openssl rand -base64 32` and export it.
#
# They are written as ${VAR}: conf.UseEnv expands them, an unset variable
# expands to the empty string, and Validate requires at least 32 characters —
# so a deployment that forgot to inject them fails to start with an actionable
# error rather than running on a placeholder that is committed here for anyone
# to read.

Name: aiserveweave-controlplane
Host: 0.0.0.0
Port: 8090

# go-zero 的访问日志。控制面处理凭据，因此不记录请求体。
# go-zero's access log. The control plane handles credentials, so bodies are
# not logged.
Log:
  ServiceName: aiserveweave-controlplane
  Mode: console
  Level: info

Database:
  # MySQL 9.7 supports all namespaces, including jobs and job_artifacts.
  # MySQL 9.7 支持所有迁移命名空间，包括 jobs 与 job_artifacts。
  Driver: mysql
  DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=UTC"
  MaxOpenConns: 20
  MaxIdleConns: 5
  ConnMaxLifetime: 30m
  # Apply embedded versioned SQL locally; production runs -migrate up first,
  # then starts with this disabled and checks schema compatibility only.
  # 本地执行内嵌版本 SQL；生产先运行 -migrate up，再关闭本项，仅检查 schema 兼容性。
  AutoMigrate: true

# Required for revocable sessions and API Key verification caching.
# 必填，用于可吊销会话和 API Key 校验缓存。
Redis:
  Addr: "redis:6379"
  Password: ""
  DB: 0
  # Natural verification-cache expiry; the transactional outbox retries
  # revocation notifications across crashes. TTL remains defense in depth.
  # 校验缓存的自然过期时间；事务 outbox 跨崩溃重试吊销通知，TTL 保留为纵深防御。
  TTL: 30s

Auth:
  # 占位符，务必替换。
  # Placeholder. Replace it.
  AccessSecret: "${AISW_ACCESS_SECRET}"
  AccessExpire: 12h

# Gateway 用它调用 /internal/v1/apikeys/verify。
# The Gateway presents this to /internal/v1/apikeys/verify.
InternalToken: "${AISW_INTERNAL_TOKEN}"

# 授权创建租户。它是 Console 将来注册流程的临时替身。
# Authorizes tenant creation. It stands in for the Console's eventual sign-up
# flow.
BootstrapToken: "${AISW_BOOTSTRAP_TOKEN}"

# Registry 的 TokenAdmin 客户端：驱动平台运维的节点操作（批准/禁用/启用/维护）与
# GET .../nodes/states。CACertFile 复用 registry-init 签发的同一份 CA——见本目录
# README「证书链是怎么闭合的」——AdminToken 须与 registry 服务的 -admin-token-file
# 内容一致。
#
# The Registry's TokenAdmin client: drives the platform operator's node
# operations (approve/disable/enable/maintenance) and GET .../nodes/states.
# CACertFile reuses the same CA registry-init issues — see this directory's
# README's "证书链是怎么闭合的" — AdminToken must match the registry service's
# -admin-token-file content.
Registry:
  Addr: "registry:9443"
  CACertFile: "/registry-data/ca/ca-cert.pem"
  AdminToken: "${AISW_REGISTRY_ADMIN_TOKEN}"

# 机群聚合：向每个 Gateway 副本的 -admin-addr 只读清单发问，驱动平台运维的节点/模型/
# 路由与工作流模板状态/job 页面。GatewayToken 须与 gateway 服务的 AISW_GATEWAY_ADMIN_TOKEN
# 一致。这套编排只有一个 Gateway 副本，见本目录 README「已知限制」。
#
# Fleet aggregation: asks each Gateway replica's read-only -admin-addr
# inventory, driving the platform operator's node/model/routing and
# workflow-template status/job pages. GatewayToken must match the gateway
# service's AISW_GATEWAY_ADMIN_TOKEN. This compose stack runs a single
# Gateway replica — see this directory's README's "已知限制".
Fleet:
  Gateways: ["http://gateway:8091"]
  GatewayToken: "${AISW_GATEWAY_ADMIN_TOKEN}"

# 模型拉取转发（STATUS.md 的 P2 模型分发子任务二）：把针对单个节点的拉取触发/状态查询
# 转发给持有该节点连接的那个 Gateway 副本。指向的是 gateway 服务另一个独立的
# -model-pull-addr 监听器（不是 Fleet 用的 -admin-addr），GatewayToken 须与 gateway 服务的
# AISW_GATEWAY_MODEL_PULL_TOKEN 一致——两个监听器绝不能共用 token。
#
# Model-pull forwarding (STATUS.md's P2 model distribution subtask two):
# forwards a per-node pull trigger/status call to whichever Gateway replica
# holds that node's connection. It points at the gateway service's other,
# separate -model-pull-addr listener (not Fleet's -admin-addr); GatewayToken
# must match the gateway service's AISW_GATEWAY_MODEL_PULL_TOKEN — the two
# listeners must never share a token.
ModelPull:
  Gateways: ["http://gateway:8092"]
  GatewayToken: "${AISW_GATEWAY_MODEL_PULL_TOKEN}"

# ComfyUI Managed 转发（STATUS.md 的 P2 ComfyUI Managed Docker 部署子任务二，控制面
# 转发层）：把针对单个节点的生命周期动作触发（start/stop/restart）/状态查询转发给
# 持有该节点连接的那个 Gateway 副本。指向的是 gateway 服务另一个独立的
# -comfyui-managed-addr 监听器（既不是 Fleet 的 -admin-addr，也不是 ModelPull 的
# -model-pull-addr），GatewayToken 须与 gateway 服务的
# AISW_GATEWAY_COMFYUI_MANAGED_TOKEN 一致——三个监听器绝不能共用 token。
#
# ComfyUI Managed forwarding (STATUS.md's P2 ComfyUI Managed Docker
# deployment subtask two, the control plane forwarding layer): forwards a
# per-node lifecycle action trigger (start/stop/restart) or status call to
# whichever Gateway replica holds that node's connection. It points at the
# gateway service's other, separate -comfyui-managed-addr listener (neither
# Fleet's -admin-addr nor ModelPull's -model-pull-addr); GatewayToken must
# match the gateway service's AISW_GATEWAY_COMFYUI_MANAGED_TOKEN — the three
# listeners must never share a token.
ComfyUIManaged:
  Gateways: ["http://gateway:8093"]
  GatewayToken: "${AISW_GATEWAY_COMFYUI_MANAGED_TOKEN}"

# 工作流可视化编辑器（P03 后续）：指向一份由 scripts/fetch-comfyui-frontend.sh 解压的
# ComfyUI_frontend 发布包。默认关闭——启用后目录缺失或不完整会让控制面启动失败，
# 因此先把目录挂进容器（例如 ./comfy-editor:/opt/aiserveweave/comfy-editor:ro）再取消注释。
# 升级时先升级 Gateway，再升级控制面，原因见 ControlPlane STATUS「工作流可视化编辑器」。
#
# Visual workflow editor (P03 follow-up): points at a ComfyUI_frontend release
# unpacked by scripts/fetch-comfyui-frontend.sh. Off by default — once enabled,
# a missing or incomplete directory stops the control plane from starting, so
# mount it into the container first (for example
# ./comfy-editor:/opt/aiserveweave/comfy-editor:ro), then uncomment. Upgrade
# Gateways before the control plane; see ControlPlane STATUS, "工作流可视化编辑器".
# ComfyEditor:
#   DistDir: /opt/aiserveweave/comfy-editor


Middlewares:
  Log: false

Signup:
  Enabled: true
  MaxPerHour: 10
  RequestsPerMinute: 60
  TokensPerMinute: 100000
  MaxConcurrent: 4

# 商户自有节点：默认开启。商户的 owner/admin 可在 Console「我的节点」生成接入包，把自己的
# 机器接成只供本商户使用的节点，跑在上面的请求不扣点数。两个地址写进接入包，须与 Registry、
# Gateway 隧道证书里的域名一致；compose 从 deploy/.env 的 REGISTRY_ADVERTISE_ADDR 与
# GATEWAY_ADVERTISE_ADDR 传入。不想开放时把 Enabled 改为 false。详见 ControlPlane STATUS
# 「商户自有节点」。
#
# Tenant-owned nodes: on by default. A tenant's owner/admin generates an
# enrollment bundle on the Console's "My nodes" page and connects a machine
# of their own that only that tenant can use; requests it serves are not
# charged. Both addresses are written into the bundle and must match the
# names in the Registry and Gateway tunnel certificates; compose passes them
# from REGISTRY_ADVERTISE_ADDR and GATEWAY_ADVERTISE_ADDR in deploy/.env. Set
# Enabled to false to keep tenants from enrolling nodes. See ControlPlane
# STATUS, "商户自有节点".
TenantNodes:
  Enabled: true
  RegistryAddr: "${AISW_TENANT_NODE_REGISTRY_ADDR}"
  GatewayAddr: "${AISW_TENANT_NODE_GATEWAY_ADDR}"
  MaxPerTenant: 10
  MaxCreatesPerDay: 10

# 计费与充值（Dodo Payments）：默认关闭。开启后租户可预付购买点数，用量按运维配置的
# 模型单价从余额扣减，prepaid 租户余额耗尽时 Gateway 返回 402。先在 deploy/.env 填好
# AISW_DODO_API_KEY 与 AISW_DODO_WEBHOOK_SECRET（前缀 dodo_test_ / dodo_live_ 须与
# Environment 一致），在 Dodo 控制台把 webhook 指向 <控制面公网地址>/billing/v1/dodo/webhook，
# 再取消注释。ReturnURL 是付款后回跳的 Console 计费页。详见 ControlPlane STATUS「计费与充值」。
#
# Billing and top-ups (Dodo Payments): off by default. When enabled, tenants
# prepay for credits, usage is charged against the balance at the operator's
# model prices, and Gateway answers 402 once a prepaid tenant's balance runs
# out. Fill AISW_DODO_API_KEY and AISW_DODO_WEBHOOK_SECRET in deploy/.env
# first (the dodo_test_ / dodo_live_ prefix must match Environment), point
# the Dodo dashboard's webhook at <public control plane URL>/billing/v1/dodo/webhook,
# then uncomment. ReturnURL is the Console billing page a payment returns to.
# See ControlPlane STATUS, "计费与充值".
# Billing:
#   Enabled: true
#   Dodo:
#     APIKey: "${AISW_DODO_API_KEY}"
#     WebhookSecret: "${AISW_DODO_WEBHOOK_SECRET}"
#     Environment: test
#   ReturnURL: https://console.example.com/console/billing
#   SignupGrantCredits: 0

