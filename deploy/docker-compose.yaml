# A runnable AIServeWeave includes Console alongside its backend services.
# 一套可以跑起来的 AIServeWeave：Console、依赖服务、Registry、控制面与 Gateway。
#
# Agent 刻意不在这里：它的工作是连本机上已经跑着的 Ollama / vLLM / ComfyUI，
# 而把它塞进容器只会在它与那些后端之间多一层网络。用法见下面的注释。
#
# 起步：
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env      # four independent secrets / 四个独立密钥
#   docker compose up -d
#
# 证书链：Registry 首次启动时生成自己的 CA，Gateway 的隧道证书由它签发
# （registry-init 这一步）。Agent 用同一个 CA 验证 Gateway——这不是巧合，而是
# tunnel/identity.go 的信任模型：Agent 只信任 Registry 的 CA。
#
# A runnable AIServeWeave: the dependencies, the Registry, the control plane
# and the Gateway, with the Console UI.
#
# The Agent is deliberately absent. Its job is to reach the Ollama / vLLM /
# ComfyUI already running on a machine, and putting it in a container only adds
# a network hop between it and those backends. See the note at the bottom for
# how to run it.
#
# Getting started:
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env      # four independent secrets / 四个独立密钥
#   docker compose up -d
#
# The certificate chain: the Registry generates its own CA on first start, and
# signs the Gateway's tunnel certificate from it (the registry-init step). An
# Agent verifies the Gateway against that same CA — not a coincidence but the
# trust model in tunnel/identity.go, where the Registry CA is the only root an
# Agent trusts.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiserveweave}
      POSTGRES_USER: ${POSTGRES_USER:-aiserveweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiserveweave}
      # postgres 18+ 的镜像要求 PGDATA 是挂载点下的子目录，直接挂到
      # /var/lib/postgresql/data 会被当成旧版本残留数据而拒绝启动。
      # The postgres 18+ image requires PGDATA to be a subdirectory of the
      # mount point; mounting straight onto /var/lib/postgresql/data makes it
      # refuse to start, mistaking the empty mount for pre-18 leftover data.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:9.7
    restart: unless-stopped
    # 默认不启动，避免同时占着两个数据库；需要时加 --profile mysql。
    # Not started by default, so two databases are not held open at once; add
    # --profile mysql when you need it.
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aiserveweave}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiserveweave}
      MYSQL_USER: ${MYSQL_USER:-aiserveweave}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aiserveweave}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # P05 会话吊销以 Redis 为权威状态；确认成功的写入必须先 fsync。
    # P05 session revocation is authoritative in Redis; acknowledged writes
    # must be fsynced before they are reported successful.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # AIServeWeave 自己的三个二进制 / The three AIServeWeave binaries
  # ---------------------------------------------------------------------

  # registry-init 跑一次就退出：它让 Registry 生成 CA（LoadOrCreate 的副作用），
  # 并从那个 CA 签一张 Gateway 隧道监听器用的服务端证书。
  #
  # 它必须先于 gateway 完成，因此 gateway 用 service_completed_successfully 等它。
  #
  # registry-init runs once and exits: it makes the Registry generate its CA (a
  # side effect of LoadOrCreate) and signs a server certificate from that CA for
  # the Gateway's tunnel listener.
  #
  # It has to finish before the gateway starts, which is what
  # service_completed_successfully below waits for.
  registry-init:
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveRegistry
    command:
      - -data-dir=/data
      - -issue-server-cert
      - -tls-host=gateway,127.0.0.1,localhost
      - -out-dir=/data/gateway-certs
    volumes:
      - registry-data:/data
    restart: "no"

  registry:
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveRegistry
    restart: unless-stopped
    command:
      - -addr=:9443
      - -data-dir=/data
      - -tls-host=registry,127.0.0.1,localhost
      # 容器内绑 0.0.0.0，只映射到宿主机回环——与 gateway 的 -metrics-addr 同一条
      # 理由：导出内容点名每一个曾经注册过的 node_id。绑 0.0.0.0 是为了让控制面
      # 容器能在 compose 内部网络上以 registry:9091 抓取它（P08 的
      # MetricsHistory 采集器），而不是为了对宿主机之外开放。
      #
      # Bound to 0.0.0.0 inside the container, published only on the host's
      # loopback — same reasoning as gateway's -metrics-addr: the export
      # names every node_id ever registered. Binding 0.0.0.0 is so the
      # control plane container can scrape it as registry:9091 on the
      # compose-internal network (P08's MetricsHistory collector), not to
      # open it beyond the host.
      - -metrics-addr=:9091
      - -log-level=${LOG_LEVEL:-info}
    volumes:
      - registry-data:/data
    ports:
      # 暴露到回环，好让宿主机上的 Agent 能换证书。
      # Exposed on loopback so an Agent on the host can get its certificate.
      - "127.0.0.1:${REGISTRY_PORT:-9443}:9443"
      - "127.0.0.1:${REGISTRY_METRICS_PORT:-9091}:9091"
    depends_on:
      registry-init:
        condition: service_completed_successfully

  controlplane:
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveControlPlane
    restart: unless-stopped
    command: ["-f", "/etc/aiserveweave/controlplane.yaml"]
    environment:
      # 这三个是密钥。compose 在这里提供默认值，配置文件里只有 ${VAR}
      # ——conf.UseEnv 不支持带默认值的形式，见 controlplane.yaml 的注释。
      #
      # These three are secrets. Compose supplies the defaults here and the
      # config file carries only ${VAR}: conf.UseEnv has no default-value form,
      # as controlplane.yaml notes.
      AISW_ACCESS_SECRET: ${AISW_ACCESS_SECRET:?set it in deploy/.env — openssl rand -base64 32}
      AISW_INTERNAL_TOKEN: ${AISW_INTERNAL_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_BOOTSTRAP_TOKEN: ${AISW_BOOTSTRAP_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      POSTGRES_USER: ${POSTGRES_USER:-aiserveweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiserveweave}
      POSTGRES_DB: ${POSTGRES_DB:-aiserveweave}
    volumes:
      - ./controlplane.yaml:/etc/aiserveweave/controlplane.yaml:ro
    ports:
      - "127.0.0.1:${CONTROLPLANE_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # bootstrap runs once and exits: if AISW_DEFAULT_OWNER_EMAIL is set, it waits
  # for controlplane to accept connections and then creates that tenant and
  # owner, the same call the "第一个租户与第一个 key" section of the README
  # walks through by hand. Left unset, it prints one line and exits 0 — this
  # is opt-in, and a fresh clone with an unedited .env creates nothing.
  #
  # A second run (a restart, or `docker compose up` again) finds the account
  # already exists (the control plane answers 409) and exits 0 without
  # touching it — recreating this container is not a way to reset the
  # password, only `docker compose exec controlplane ...` or the Console
  # itself can do that.
  #
  # bootstrap 跑一次就退出：如果设置了 AISW_DEFAULT_OWNER_EMAIL，它会等 controlplane
  # 能接受连接后创建那个租户与 owner，与 README「第一个租户与第一个 key」一节手动走的是
  # 同一个调用。不设置则打一行日志、退出 0——这是可选的，一份没改过 .env 的全新 clone
  # 不会自动创建任何东西。
  #
  # 再次运行（重启，或再来一次 `docker compose up`）会发现账号已存在（控制面答 409），
  # 什么也不碰就退出 0——重建这个容器不是重置密码的办法，只有 `docker compose exec
  # controlplane ...` 或 Console 自己能做到。
  bootstrap:
    image: curlimages/curl:8.11.1
    restart: "no"
    environment:
      AISW_BOOTSTRAP_TOKEN: ${AISW_BOOTSTRAP_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_DEFAULT_TENANT_NAME: ${AISW_DEFAULT_TENANT_NAME:-Default}
      AISW_DEFAULT_OWNER_EMAIL: ${AISW_DEFAULT_OWNER_EMAIL:-}
      AISW_DEFAULT_OWNER_PASSWORD: ${AISW_DEFAULT_OWNER_PASSWORD:-}
    depends_on:
      controlplane:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose's own ${VAR} interpolation: everything after it is
    # read by the shell inside the curl image, not substituted by compose
    # when this file is parsed.
    #
    # $$ 是为了转义 compose 自己的 ${VAR} 插值：往后的内容由 curl 镜像里的 shell 读取，
    # 而不是在解析这份文件时被 compose 替换掉。
    command:
      - |
        set -eu
        if [ -z "$$AISW_DEFAULT_OWNER_EMAIL" ]; then
          echo "bootstrap: AISW_DEFAULT_OWNER_EMAIL is empty, skipping automatic tenant creation (see deploy/README.md for the manual curl)"
          exit 0
        fi
        i=0
        until curl -s -o /dev/null http://controlplane:8090/admin/v1/auth/login -X POST -d '{}'; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "bootstrap: controlplane did not accept connections within 120s, giving up"
            exit 1
          fi
          sleep 2
        done
        body=$$(mktemp)
        status=$$(curl -sS -o "$$body" -w '%{http_code}' -X POST http://controlplane:8090/admin/v1/tenants \
          -H "Authorization: Bearer $$AISW_BOOTSTRAP_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$AISW_DEFAULT_TENANT_NAME\",\"owner_email\":\"$$AISW_DEFAULT_OWNER_EMAIL\",\"owner_password\":\"$$AISW_DEFAULT_OWNER_PASSWORD\"}")
        case "$$status" in
          201)
            echo "bootstrap: default tenant and owner created, log into Console with $$AISW_DEFAULT_OWNER_EMAIL"
            ;;
          409)
            echo "bootstrap: that email already has a tenant, nothing to do"
            ;;
          *)
            echo "bootstrap: tenant creation failed with HTTP $$status"
            cat "$$body"
            exit 1
            ;;
        esac

  console:
    build:
      context: ../service/aiServeWeaveConsole
    restart: unless-stopped
    environment:
      AISW_CONSOLE_CONTROL_PLANE_URL: http://controlplane:8090
      AISW_CONSOLE_SESSION_SECRET: ${AISW_CONSOLE_SESSION_SECRET:?set it in deploy/.env — openssl rand -base64 48}
      # Local Compose uses HTTP on loopback. Enable Secure cookies behind HTTPS.
      # 本地 Compose 使用回环 HTTP；部署在 HTTPS 之后时启用 Secure Cookie。
      AISW_CONSOLE_COOKIE_SECURE: ${AISW_CONSOLE_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      controlplane:
        condition: service_started
    healthcheck:
      # Check the UI without credentials; backend availability is independent.
      # 无凭据检查 UI，后端可用性独立判断。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveGateway
    restart: unless-stopped
    command:
      - -addr=:8080
      - -tunnel-addr=:8443
      # Agent 拨的是这个地址，因此它必须是宿主机上可达的那个，而不是容器内的。
      # An Agent dials this, so it has to be the address reachable from the
      # host rather than the one inside the container network.
      - -tunnel-advertise-addr=${GATEWAY_ADVERTISE_ADDR:-127.0.0.1:8443}
      # 全部三份材料都来自 Registry 的 data volume：registry-init 签出的那张证书，
      # 以及 Registry 自己生成的 CA bundle。
      #
      # All three come from the Registry's data volume: the certificate
      # registry-init signed, and the CA bundle the Registry generated itself.
      - -tls-cert=/registry-data/gateway-certs/server-cert.pem
      - -tls-key=/registry-data/gateway-certs/server-key.pem
      # 节点证书由 Registry 的 CA 签发，因此这里的客户端 CA 就是那份 CA bundle。
      # Node certificates are signed by the Registry's CA, so the client CA
      # here is that same bundle.
      - -client-ca=/registry-data/ca/ca-cert.pem
      - -registry-addr=registry:9443
      - -registry-ca=/registry-data/ca/ca-cert.pem
      - -control-plane-addr=http://controlplane:8090
      - -redis-addr=redis:6379
      # 容器内绑 0.0.0.0，但端口只映射到宿主机回环，因此实际暴露面与
      # Gateway README 那条「默认只绑回环」的意图一致：导出内容会点出每一个
      # 连着的 node_id，那不是一份该对外派发的清单。
      #
      # Bound to 0.0.0.0 inside the container but published only on the host's
      # loopback, so the reachable surface matches the intent the Gateway
      # README states for the loopback default: the export names every
      # connected node_id, which is not a list to hand out.
      - -metrics-addr=:9090
      - -log-level=${LOG_LEVEL:-info}
    environment:
      # flag 在 ps 输出里可见，因此内部令牌走环境变量。
      # A flag is visible in ps output, so the internal token goes through the
      # environment.
      AISW_CONTROL_PLANE_TOKEN: ${AISW_INTERNAL_TOKEN:?set it in deploy/.env}
    volumes:
      # 只读挂载：Gateway 出示这些材料，从不写它们。私钥是 0600，而两个镜像用的是
      # 同一个 uid，因此读得到。
      #
      # Mounted read-only: the Gateway presents these and never writes them.
      # The private key is 0600 and both images run as the same uid, which is
      # what makes it readable.
      - registry-data:/registry-data:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_TUNNEL_PORT:-8443}:8443"
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9090}:9090"
    depends_on:
      registry:
        condition: service_started
      controlplane:
        condition: service_started
      redis:
        condition: service_healthy

# Agent 在宿主机上跑，因为它要连本机的推理后端：
#
#   TOKEN=$(docker compose exec -T registry /usr/local/bin/service \
#             -data-dir /data -mint-token)
#   echo "$TOKEN" > /tmp/aisw-token
#   docker compose cp registry:/data/ca/ca-cert.pem /tmp/aisw-ca.pem
#   go run ./service/aiServeWeaveAgent \
#     -registry 127.0.0.1:9443 -ca-file /tmp/aisw-ca.pem \
#     -bootstrap-token-file /tmp/aisw-token \
#     -cert-file ./data/agent/cert.pem -key-file ./data/agent/key.pem \
#     -gateway 127.0.0.1:8443 \
#     -ollama-url http://127.0.0.1:11434 \
#     -labels region=local
#
# The Agent runs on the host because it reaches this machine's own inference
# backends; the commands above are the same on any host.

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  registry-data:
