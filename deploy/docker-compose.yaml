# A runnable AIServeWeave includes Console alongside its backend services.
# 一套可以跑起来的 AIServeWeave：Console、依赖服务、Registry、控制面与 Gateway。
#
# Agent 刻意不在这里：它的工作是连本机上已经跑着的 Ollama / vLLM / ComfyUI，
# 而把它塞进容器只会在它与那些后端之间多一层网络。用法见下面的注释。
#
# 起步：
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env      # eight independent secrets / 八个独立密钥
#   docker compose up -d
#
# 证书链：Registry 首次启动时生成自己的 CA，Gateway 的隧道证书由它签发
# （registry-init 这一步）。Agent 用同一个 CA 验证 Gateway——这不是巧合，而是
# tunnel/identity.go 的信任模型：Agent 只信任 Registry 的 CA。
#
# A runnable AIServeWeave: the dependencies, the Registry, the control plane
# and the Gateway, with the Console UI.
#
# The Agent is deliberately absent. Its job is to reach the Ollama / vLLM /
# ComfyUI already running on a machine, and putting it in a container only adds
# a network hop between it and those backends. See the note at the bottom for
# how to run it.
#
# Getting started:
#
#   cd deploy
#   cp .env.example .env && $EDITOR .env      # eight independent secrets / 八个独立密钥
#   docker compose up -d
#
# The certificate chain: the Registry generates its own CA on first start, and
# signs the Gateway's tunnel certificate from it (the registry-init step). An
# Agent verifies the Gateway against that same CA — not a coincidence but the
# trust model in tunnel/identity.go, where the Registry CA is the only root an
# Agent trusts.
#
# 镜像来源：AISW_IMAGE_TAG 留空时从源码构建，镜像标为 :local；设为一个已发布的
# vX.Y.Z 时，install.sh / upgrade.sh 改为从 GHCR 拉取 release 流水线推送的同版本
# 镜像，主机上不再跑 Go 与 Next.js 构建。小内存主机（如 2 核 3G）应走后者。
#
# 资源：每个常驻服务都有内存上限，Go 服务带配套的 GOMEMLIMIT，Console 限制 V8 堆；
# 默认值按 3 GiB 主机给出，可在 .env 中覆盖（见 .env.example 的「资源上限」）。
#
# Image source: with AISW_IMAGE_TAG empty, images are built from source and
# tagged :local; set to a released vX.Y.Z, install.sh / upgrade.sh pull that
# version's images from GHCR (pushed by the release workflow) and the host
# runs no Go or Next.js build. Small hosts (e.g. 2 cores, 3 GiB) should do
# the latter.
#
# Resources: every long-running service has a memory cap, the Go services a
# matching GOMEMLIMIT, and Console a capped V8 heap; the defaults fit a 3 GiB
# host and can be overridden in .env (see .env.example's 资源上限 block).

# Rotate container logs: the default json-file driver never does, and on a
# small disk the Gateway's logs alone fill it eventually.
# 轮转容器日志：默认的 json-file 驱动从不轮转，小磁盘迟早被 Gateway 日志写满。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiserveweave}
      POSTGRES_USER: ${POSTGRES_USER:-aiserveweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiserveweave}
      # postgres 18+ 的镜像要求 PGDATA 是挂载点下的子目录，直接挂到
      # /var/lib/postgresql/data 会被当成旧版本残留数据而拒绝启动。
      # The postgres 18+ image requires PGDATA to be a subdirectory of the
      # mount point; mounting straight onto /var/lib/postgresql/data makes it
      # refuse to start, mistaking the empty mount for pre-18 leftover data.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:9.7
    restart: unless-stopped
    logging: *logging
    # MySQL is the default database because Job persistence requires it.
    # MySQL 是默认数据库，因为 Job 持久化依赖它。
    #
    # Sized for a small single host. performance_schema alone takes 100 MB+
    # and nothing here reads it. Only the control plane connects, with
    # MaxOpenConns 20, so 60 connections leave room for backups and a shell.
    # The binary log serves replication and point-in-time recovery, neither of
    # which this single-instance deployment uses (backups are mysqldump, see
    # database-recovery.md), and costs an fsync per commit plus disk.
    #
    # 按单台小主机调整。仅 performance_schema 就占 100 MB 以上，而这里没有任何东西读它。
    # 只有控制面连库，MaxOpenConns 为 20，60 个连接给备份与手工排查留了余量。binlog 服务于
    # 主从复制与按时间点恢复，这套单实例部署两者都不用（备份走 mysqldump，见
    # database-recovery.md），却要每次提交多一次 fsync 并占用磁盘。
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --innodb-log-buffer-size=16M
      - --temptable-max-ram=64M
      - --max-connections=256
      - --disable-log-bin
    mem_limit: ${MYSQL_MEM_LIMIT:-1024m}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aiserveweave}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiserveweave}
      MYSQL_USER: ${MYSQL_USER:-aiserveweave}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aiserveweave}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    # P05 会话吊销以 Redis 为权威状态；确认成功的写入必须先 fsync。
    # P05 session revocation is authoritative in Redis; acknowledged writes
    # must be fsynced before they are reported successful.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    # A container cap only, no maxmemory: an eviction policy would drop
    # authoritative revocation state, which must never happen silently. The
    # headroom covers the fork during an AOF rewrite.
    # 只设容器上限、不设 maxmemory：淘汰策略会丢掉作为权威的吊销状态，这绝不能悄悄发生。
    # 余量用于 AOF 重写时的 fork。
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # AIServeWeave 自己的三个二进制 / The three AIServeWeave binaries
  # ---------------------------------------------------------------------

  # registry-init 跑一次就退出：它让 Registry 生成 CA（LoadOrCreate 的副作用），
  # 并从那个 CA 签一张 Gateway 隧道监听器用的服务端证书。
  #
  # 它必须先于 gateway 完成，因此 gateway 用 service_completed_successfully 等它。
  #
  # registry-init runs once and exits: it makes the Registry generate its CA (a
  # side effect of LoadOrCreate) and signs a server certificate from that CA for
  # the Gateway's tunnel listener.
  #
  # It has to finish before the gateway starts, which is what
  # service_completed_successfully below waits for.
  registry-init:
    # registry-init 与 registry 是同一个镜像，名字一致，构建或拉取一次即可。
    # registry-init and registry are one image under one name, built or pulled once.
    image: ${AISW_IMAGE_REPO:-ghcr.io/dongmu101}/aiserveweave-registry:${AISW_IMAGE_TAG:-local}
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveRegistry
    logging: *logging
    command:
      - -data-dir=/data
      - -issue-server-cert
      - -tls-host=gateway,127.0.0.1,localhost,agent.open7x.com
      - -out-dir=/data/gateway-certs
    volumes:
      - registry-data:/data
    restart: "no"

  registry:
    image: ${AISW_IMAGE_REPO:-ghcr.io/dongmu101}/aiserveweave-registry:${AISW_IMAGE_TAG:-local}
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveRegistry
    restart: unless-stopped
    logging: *logging
    mem_limit: ${REGISTRY_MEM_LIMIT:-128m}
    environment:
      # GOMEMLIMIT is a soft target about 80% of the container cap: the Go GC
      # works harder near it instead of letting the heap run into the
      # kernel's OOM kill. Raise both together.
      # GOMEMLIMIT 是约为容器上限 80% 的软目标：堆接近它时 Go GC 更积极地回收，而不是一路
      # 涨到被内核 OOM 杀掉。调整时两者一起改。
      GOMEMLIMIT: ${REGISTRY_GOMEMLIMIT:-100MiB}
      # TokenAdmin 的共享密钥，由下面的入口脚本写进 -admin-token-file；须与
      # controlplane.yaml 里 Registry.AdminToken 的值一致。
      #
      # TokenAdmin's shared secret, written to the -admin-token-file below by
      # the entrypoint script; must match controlplane.yaml's
      # Registry.AdminToken.
      AISW_REGISTRY_ADMIN_TOKEN: ${AISW_REGISTRY_ADMIN_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
    # -admin-token-file only takes a file path, not an inline value
    # (loadAdminToken in the Registry's main.go reads it from disk), so this
    # entrypoint writes the env var to the data volume once before exec'ing
    # the actual binary — the same reasoning as bootstrap's shell wrapper
    # below, applied to ENTRYPOINT instead of command.
    #
    # -admin-token-file 只接受文件路径而非内联值（Registry main.go 里的
    # loadAdminToken 从磁盘读取），所以这个入口先把环境变量写进数据卷一次，再
    # exec 真正的二进制——与下面 bootstrap 的 shell 包装同一个理由，只是用在了
    # ENTRYPOINT 而不是 command 上。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "$$AISW_REGISTRY_ADMIN_TOKEN" > /data/admin-token
        exec /usr/local/bin/service \
          -addr=:9443 \
          -data-dir=/data \
          -tls-host=registry,127.0.0.1,localhost,registry.open7x.com \
          -admin-token-file=/data/admin-token \
          -metrics-addr=:9091 \
          -log-level=${LOG_LEVEL:-info}
      # 容器内绑 0.0.0.0，只映射到宿主机回环——与 gateway 的 -metrics-addr 同一条
      # 理由：导出内容点名每一个曾经注册过的 node_id。绑 0.0.0.0 是为了让控制面
      # 容器能在 compose 内部网络上以 registry:9091 抓取它（P08 的
      # MetricsHistory 采集器），而不是为了对宿主机之外开放。
      #
      # Bound to 0.0.0.0 inside the container, published only on the host's
      # loopback — same reasoning as gateway's -metrics-addr: the export
      # names every node_id ever registered. Binding 0.0.0.0 is so the
      # control plane container can scrape it as registry:9091 on the
      # compose-internal network (P08's MetricsHistory collector), not to
      # open it beyond the host.
    volumes:
      - registry-data:/data
    ports:
      # Remote Agents register and renew over TLS; restrict ingress to their source IPs.
      # 远程 Agent 通过 TLS 注册与续期；入站访问应限制为节点的出口 IP。
      - "0.0.0.0:${REGISTRY_PORT:-9443}:9443"
      - "127.0.0.1:${REGISTRY_METRICS_PORT:-9091}:9091"
    depends_on:
      registry-init:
        condition: service_completed_successfully

  controlplane:
    image: ${AISW_IMAGE_REPO:-ghcr.io/dongmu101}/aiserveweave-controlplane:${AISW_IMAGE_TAG:-local}
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveControlPlane
    restart: unless-stopped
    logging: *logging
    command: ["-f", "/etc/aiserveweave/controlplane.yaml"]
    mem_limit: ${CONTROLPLANE_MEM_LIMIT:-384m}
    environment:
      GOMEMLIMIT: ${CONTROLPLANE_GOMEMLIMIT:-300MiB}
      # 这七个是密钥。compose 在这里提供默认值，配置文件里只有 ${VAR}
      # ——conf.UseEnv 不支持带默认值的形式，见 controlplane.yaml 的注释。
      #
      # These seven are secrets. Compose supplies the defaults here and the
      # config file carries only ${VAR}: conf.UseEnv has no default-value form,
      # as controlplane.yaml notes.
      AISW_ACCESS_SECRET: ${AISW_ACCESS_SECRET:?set it in deploy/.env — openssl rand -base64 32}
      AISW_INTERNAL_TOKEN: ${AISW_INTERNAL_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_BOOTSTRAP_TOKEN: ${AISW_BOOTSTRAP_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_REGISTRY_ADMIN_TOKEN: ${AISW_REGISTRY_ADMIN_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_ADMIN_TOKEN: ${AISW_GATEWAY_ADMIN_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_MODEL_PULL_TOKEN: ${AISW_GATEWAY_MODEL_PULL_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_COMFYUI_MANAGED_TOKEN: ${AISW_GATEWAY_COMFYUI_MANAGED_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      # Dodo Payments credentials, read only when controlplane.yaml enables
      # Billing; empty by default because billing is off.
      # Dodo Payments 凭据，只在 controlplane.yaml 开启 Billing 时读取；计费默认关闭，因此默认为空。
      # Hosted provider provisioning (controlplane.yaml's RemoteProviders), on
      # by default; install.sh and upgrade.sh generate both values.
      # 托管供应商下发（controlplane.yaml 的 RemoteProviders），默认开启；install.sh 与
      # upgrade.sh 会生成这两个值。
      AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN: ${AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_PROVIDER_MASTER_KEY: ${AISW_PROVIDER_MASTER_KEY:?set it in deploy/.env — openssl rand -base64 32}
      AISW_DODO_API_KEY: ${AISW_DODO_API_KEY:-}
      AISW_DODO_WEBHOOK_SECRET: ${AISW_DODO_WEBHOOK_SECRET:-}
      # 一人付 (opcpay) API key for Alipay, read straight from the environment
      # only when controlplane.yaml enables Billing.Alipay; it never goes into
      # the config file. Empty by default.
      # 一人付（opcpay）支付宝 API Key，只在 controlplane.yaml 开启 Billing.Alipay 时直接从
      # 环境变量读取，从不写进配置文件。默认为空。
      opcpay_api_key: ${opcpay_api_key:-}
      # Public Registry and Gateway tunnel addresses written into tenant node
      # enrollment bundles (controlplane.yaml's TenantNodes).
      # 写进商户自有节点接入包的 Registry 与 Gateway 隧道对外地址（controlplane.yaml 的 TenantNodes）。
      AISW_TENANT_NODE_REGISTRY_ADDR: ${REGISTRY_ADVERTISE_ADDR:-registry.open7x.com:9443}
      AISW_TENANT_NODE_GATEWAY_ADDR: ${GATEWAY_ADVERTISE_ADDR:-agent.open7x.com:8443}
      # Platform origin written into Agent install commands (controlplane.yaml's
      # AgentInstall.PublicURL); empty keeps code issuing off.
      # 写进 Agent 安装命令的平台站点地址（controlplane.yaml 的 AgentInstall.PublicURL）；
      # 留空则不提供签发。
      AISW_AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
      MYSQL_USER: ${MYSQL_USER:-aiserveweave}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aiserveweave}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiserveweave}
    volumes:
      - ./controlplane.yaml:/etc/aiserveweave/controlplane.yaml:ro
      # 只读，读的是 registry-init 签发的同一份 CA（见本目录 README「证书链是怎么
      # 闭合的」），供 Registry.CACertFile 校验 Registry 的服务端证书。
      #
      # Read-only, the same CA registry-init issues (see this directory's
      # README's "证书链是怎么闭合的"), for Registry.CACertFile to verify the
      # Registry's server certificate.
      - registry-data:/registry-data:ro
    ports:
      - "127.0.0.1:${CONTROLPLANE_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry-init:
        condition: service_completed_successfully

  # bootstrap runs once and exits: if AISW_DEFAULT_OWNER_EMAIL is set, it waits
  # for controlplane to accept connections and then creates that tenant and
  # owner, the same call the "第一个租户与第一个 key" section of the README
  # walks through by hand. Left unset, it prints one line and exits 0 — this
  # is opt-in, and a fresh clone with an unedited .env creates nothing.
  # If AISW_DEFAULT_OPERATOR_EMAIL is also set, it then creates a platform
  # operator the same way, using the same bootstrap token (createPlatformOperator
  # accepts no other credential — see its doc comment in the control plane).
  #
  # A second run (a restart, or `docker compose up` again) finds the account(s)
  # already exist (the control plane answers 409) and exits 0 without
  # touching them — recreating this container is not a way to reset a
  # password, only `docker compose exec controlplane ...` or the Console
  # itself can do that.
  #
  # bootstrap 跑一次就退出：如果设置了 AISW_DEFAULT_OWNER_EMAIL，它会等 controlplane
  # 能接受连接后创建那个租户与 owner，与 README「第一个租户与第一个 key」一节手动走的是
  # 同一个调用。不设置则打一行日志、退出 0——这是可选的，一份没改过 .env 的全新 clone
  # 不会自动创建任何东西。若同时设置了 AISW_DEFAULT_OPERATOR_EMAIL，接着会用同一个
  # bootstrap token 创建一个平台运维账户（createPlatformOperator 不接受其他凭据，
  # 见控制面里它的文档注释）。
  #
  # 再次运行（重启，或再来一次 `docker compose up`）会发现账号已存在（控制面答 409），
  # 什么也不碰就退出 0——重建这个容器不是重置密码的办法，只有 `docker compose exec
  # controlplane ...` 或 Console 自己能做到。
  bootstrap:
    image: curlimages/curl:8.11.1
    restart: "no"
    logging: *logging
    environment:
      AISW_BOOTSTRAP_TOKEN: ${AISW_BOOTSTRAP_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_DEFAULT_TENANT_NAME: ${AISW_DEFAULT_TENANT_NAME:-Default}
      AISW_DEFAULT_OWNER_EMAIL: ${AISW_DEFAULT_OWNER_EMAIL:-}
      AISW_DEFAULT_OWNER_PASSWORD: ${AISW_DEFAULT_OWNER_PASSWORD:-}
      AISW_DEFAULT_OPERATOR_EMAIL: ${AISW_DEFAULT_OPERATOR_EMAIL:-}
      AISW_DEFAULT_OPERATOR_PASSWORD: ${AISW_DEFAULT_OPERATOR_PASSWORD:-}
      AISW_DEFAULT_OPERATOR_NAME: ${AISW_DEFAULT_OPERATOR_NAME:-Admin}
    depends_on:
      controlplane:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose's own ${VAR} interpolation: everything after it is
    # read by the shell inside the curl image, not substituted by compose
    # when this file is parsed.
    #
    # $$ 是为了转义 compose 自己的 ${VAR} 插值：往后的内容由 curl 镜像里的 shell 读取，
    # 而不是在解析这份文件时被 compose 替换掉。
    command:
      - |
        set -eu
        if [ -z "$$AISW_DEFAULT_OWNER_EMAIL" ] && [ -z "$$AISW_DEFAULT_OPERATOR_EMAIL" ]; then
          echo "bootstrap: AISW_DEFAULT_OWNER_EMAIL and AISW_DEFAULT_OPERATOR_EMAIL are both empty, skipping automatic account creation (see deploy/README.md for the manual curl)"
          exit 0
        fi
        i=0
        until curl -s -o /dev/null http://controlplane:8090/admin/v1/auth/login -X POST -d '{}'; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "bootstrap: controlplane did not accept connections within 120s, giving up"
            exit 1
          fi
          sleep 2
        done
        if [ -n "$$AISW_DEFAULT_OWNER_EMAIL" ]; then
          body=$$(mktemp)
          status=$$(curl -sS -o "$$body" -w '%{http_code}' -X POST http://controlplane:8090/admin/v1/tenants \
            -H "Authorization: Bearer $$AISW_BOOTSTRAP_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$$AISW_DEFAULT_TENANT_NAME\",\"owner_email\":\"$$AISW_DEFAULT_OWNER_EMAIL\",\"owner_password\":\"$$AISW_DEFAULT_OWNER_PASSWORD\"}")
          case "$$status" in
            201)
              echo "bootstrap: default tenant and owner created, log into Console with $$AISW_DEFAULT_OWNER_EMAIL"
              ;;
            409)
              echo "bootstrap: that email already has a tenant, nothing to do"
              ;;
            *)
              echo "bootstrap: tenant creation failed with HTTP $$status"
              cat "$$body"
              exit 1
              ;;
          esac
        fi
        if [ -n "$$AISW_DEFAULT_OPERATOR_EMAIL" ]; then
          body=$$(mktemp)
          status=$$(curl -sS -o "$$body" -w '%{http_code}' -X POST http://controlplane:8090/admin/v1/platform/operators \
            -H "Authorization: Bearer $$AISW_BOOTSTRAP_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$$AISW_DEFAULT_OPERATOR_EMAIL\",\"password\":\"$$AISW_DEFAULT_OPERATOR_PASSWORD\",\"name\":\"$$AISW_DEFAULT_OPERATOR_NAME\"}")
          case "$$status" in
            201)
              echo "bootstrap: default platform operator created, log into Console with $$AISW_DEFAULT_OPERATOR_EMAIL"
              ;;
            409)
              echo "bootstrap: that email already has a platform operator, nothing to do"
              ;;
            *)
              echo "bootstrap: platform operator creation failed with HTTP $$status"
              cat "$$body"
              exit 1
              ;;
          esac
        fi

  console:
    image: ${AISW_IMAGE_REPO:-ghcr.io/dongmu101}/aiserveweave-console:${AISW_IMAGE_TAG:-local}
    build:
      context: ../service/aiServeWeaveConsole
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CONSOLE_MEM_LIMIT:-384m}
    environment:
      # Cap the V8 old-space heap below the container limit, leaving room for
      # buffers, native memory and the healthcheck's short-lived node process.
      # 把 V8 老生代堆限制在容器上限之下，给 buffer、原生内存与健康检查临时起的 node 进程留出空间。
      NODE_OPTIONS: --max-old-space-size=${CONSOLE_NODE_HEAP_MB:-256}
      AISW_CONSOLE_CONTROL_PLANE_URL: http://controlplane:8090
      AISW_CONSOLE_SESSION_SECRET: ${AISW_CONSOLE_SESSION_SECRET:?set it in deploy/.env — openssl rand -base64 48}
      # Local Compose uses HTTP on loopback. Enable Secure cookies behind HTTPS.
      # 本地 Compose 使用回环 HTTP；部署在 HTTPS 之后时启用 Secure Cookie。
      AISW_CONSOLE_COOKIE_SECURE: ${AISW_CONSOLE_COOKIE_SECURE:-false}
      # Operator facts stated on /terms, /privacy, /refund and the page footers.
      # 公开条款页与页脚陈述的营运方资讯；未设置时显示方括号占位符。
      AISW_CONSOLE_LEGAL_SERVICE_NAME: ${AISW_CONSOLE_LEGAL_SERVICE_NAME:-}
      AISW_CONSOLE_LEGAL_COMPANY: ${AISW_CONSOLE_LEGAL_COMPANY:-}
      AISW_CONSOLE_LEGAL_ADDRESS: ${AISW_CONSOLE_LEGAL_ADDRESS:-}
      AISW_CONSOLE_LEGAL_EMAIL: ${AISW_CONSOLE_LEGAL_EMAIL:-}
      AISW_CONSOLE_LEGAL_JURISDICTION: ${AISW_CONSOLE_LEGAL_JURISDICTION:-}
      AISW_CONSOLE_LEGAL_REFUND_WINDOW_DAYS: ${AISW_CONSOLE_LEGAL_REFUND_WINDOW_DAYS:-}
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      controlplane:
        condition: service_started
    healthcheck:
      # Check the UI without credentials; backend availability is independent.
      # Every probe starts a fresh node process (tens of MB and a CPU spike),
      # so it runs once a minute rather than every 30 s.
      # 无凭据检查 UI，后端可用性独立判断。每次探测都新起一个 node 进程（数十 MB 内存与一次
      # CPU 尖峰），因此每分钟一次而不是每 30 秒。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: ${AISW_IMAGE_REPO:-ghcr.io/dongmu101}/aiserveweave-gateway:${AISW_IMAGE_TAG:-local}
    build:
      context: ..
      args:
        SERVICE: aiServeWeaveGateway
        # Platforms of the Agent artifacts baked into the image; one is enough
        # for a smoke test: AGENT_PLATFORMS="linux/amd64".
        # 内置进镜像的 Agent 制品平台；冒烟时一个就够：AGENT_PLATFORMS="linux/amd64"。
        AGENT_PLATFORMS: ${AGENT_PLATFORMS:-linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64}
    restart: unless-stopped
    logging: *logging
    # The largest Go cap: request bodies are deliberately unbounded (Claude
    # Code sends very large ones), so concurrent big requests need headroom.
    # Go 服务里上限最高：请求体刻意不设上限（Claude Code 会发很大的请求），并发的大请求需要余量。
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    command:
      - -addr=:8080
      - -tunnel-addr=:8443
      # Advertise the DNS-only endpoint reachable by remote Agents. Existing .env values override it.
      # 通告远程 Agent 可达的仅 DNS 入口；已有 .env 值会覆盖这里的默认值。
      - -tunnel-advertise-addr=${GATEWAY_ADVERTISE_ADDR:-agent.open7x.com:8443}
      # 全部三份材料都来自 Registry 的 data volume：registry-init 签出的那张证书，
      # 以及 Registry 自己生成的 CA bundle。
      #
      # All three come from the Registry's data volume: the certificate
      # registry-init signed, and the CA bundle the Registry generated itself.
      - -tls-cert=/registry-data/gateway-certs/server-cert.pem
      - -tls-key=/registry-data/gateway-certs/server-key.pem
      # 节点证书由 Registry 的 CA 签发，因此这里的客户端 CA 就是那份 CA bundle。
      # Node certificates are signed by the Registry's CA, so the client CA
      # here is that same bundle.
      - -client-ca=/registry-data/ca/ca-cert.pem
      - -registry-addr=registry:9443
      - -registry-ca=/registry-data/ca/ca-cert.pem
      - -control-plane-addr=http://controlplane:8090
      - -redis-addr=redis:6379
      # 容器内绑 0.0.0.0，但端口只映射到宿主机回环，因此实际暴露面与
      # Gateway README 那条「默认只绑回环」的意图一致：导出内容会点出每一个
      # 连着的 node_id，那不是一份该对外派发的清单。
      #
      # Bound to 0.0.0.0 inside the container but published only on the host's
      # loopback, so the reachable surface matches the intent the Gateway
      # README states for the loopback default: the export names every
      # connected node_id, which is not a list to hand out.
      - -metrics-addr=:9090
      # 只读的运维清单，供控制面的 Fleet 聚合器调用；不发布到宿主机端口——只有
      # compose 内部网络上的 controlplane 需要够到它，见 Gateway README「运维只读
      # 端点」。
      #
      # The read-only operator inventory the control plane's Fleet aggregator
      # calls; not published to a host port — only controlplane on the
      # compose-internal network needs to reach it, see the Gateway README's
      # "运维只读端点".
      - -admin-addr=:8091
      # Discover only these configured host endpoints; never scan the host network.
      # 只发现这两个已配置的宿主机端点，绝不扫描宿主机网络。
      - -local-ollama-url=${GATEWAY_LOCAL_OLLAMA_URL-http://host.docker.internal:11434}
      - -local-vllm-url=${GATEWAY_LOCAL_VLLM_URL-http://host.docker.internal:8000}
      # 按名字触发模型拉取的写监听器（STATUS.md 的 P2 模型分发子任务二）；同样不发布到
      # 宿主机端口，且刻意与上面的只读 -admin-addr 分开监听、分开 token——触发拉取是写
      # 操作，泄漏后果比读到清单更重，见 Gateway README「模型拉取触发」。
      #
      # The write listener that triggers a model pull by name (STATUS.md's P2
      # model distribution subtask two); likewise not published to a host
      # port, and deliberately a separate listener with a separate token from
      # the read-only -admin-addr above — triggering a pull is a write with a
      # heavier leak consequence than reading the inventory, see the Gateway
      # README's "模型拉取触发".
      - -model-pull-addr=:8092
      # 对本地已声明的 Managed ComfyUI 实例下发启停/重启动作的写监听器（STATUS.md 的
      # P2 ComfyUI Managed Docker 部署子任务二）；同样不发布到宿主机端口，且用与
      # -model-pull-addr 不同的独立 token——两者都是写操作，但控制的是不同的能力，
      # 泄漏后果的爆炸半径不同，见 Gateway README「ComfyUI Managed 触发」。
      #
      # The write listener that applies a start/stop/restart action to a
      # node's one locally-declared Managed ComfyUI instance (STATUS.md's P2
      # ComfyUI Managed Docker deployment subtask two); likewise not
      # published to a host port, and uses its own token distinct from
      # -model-pull-addr's — both are writes, but they gate different
      # capabilities with different leak blast radii, see the Gateway
      # README's "ComfyUI Managed 触发".
      - -comfyui-managed-addr=:8093
      # Relays Console-provisioned hosted providers, sealed by the control
      # plane to each node's certificate key, to connected Agents. On by
      # default: install.sh and upgrade.sh generate
      # AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN; the listener is never published
      # to a host port. See this directory's README's "托管供应商远程下发".
      # 把控制面封装给各节点证书公钥的托管供应商转发给已连接的 Agent。默认开启：install.sh
      # 与 upgrade.sh 会生成 AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN；不发布到宿主机端口。见本目录
      # README「托管供应商远程下发」。
      - -remote-providers-addr=${AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN:+:8094}
      # Public /agent/* install entry. Both flags are empty unless AGENT_PUBLIC_URL
      # is set, which leaves the entry off; -agent-dist-dir must be set together
      # with -agent-public-url or the Gateway refuses to start.
      # 公开的 /agent/* 安装入口。未设置 AGENT_PUBLIC_URL 时两个 flag 都为空，入口关闭；
      # -agent-dist-dir 必须与 -agent-public-url 同时设置，否则 Gateway 拒绝启动。
      - -agent-dist-dir=${AGENT_PUBLIC_URL:+/opt/aisw/agent-dist}
      - -agent-public-url=${AGENT_PUBLIC_URL:-}
      - -agent-github-repo=${AGENT_GITHUB_REPO:-dongmu101/AIServeWeave}
      - -log-level=${LOG_LEVEL:-info}
    environment:
      GOMEMLIMIT: ${GATEWAY_GOMEMLIMIT:-400MiB}
      # flag 在 ps 输出里可见，因此这四个令牌都走环境变量。
      # A flag is visible in ps output, so all four tokens go through the
      # environment.
      AISW_CONTROL_PLANE_TOKEN: ${AISW_INTERNAL_TOKEN:?set it in deploy/.env}
      AISW_GATEWAY_ADMIN_TOKEN: ${AISW_GATEWAY_ADMIN_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_MODEL_PULL_TOKEN: ${AISW_GATEWAY_MODEL_PULL_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_COMFYUI_MANAGED_TOKEN: ${AISW_GATEWAY_COMFYUI_MANAGED_TOKEN:?set it in deploy/.env — openssl rand -base64 32}
      AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN: ${AISW_GATEWAY_REMOTE_PROVIDERS_TOKEN:-}
    volumes:
      # 只读挂载：Gateway 出示这些材料，从不写它们。私钥是 0600，而两个镜像用的是
      # 同一个 uid，因此读得到。
      #
      # Mounted read-only: the Gateway presents these and never writes them.
      # The private key is 0600 and both images run as the same uid, which is
      # what makes it readable.
      - registry-data:/registry-data:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      # The Agent tunnel terminates mTLS directly; the HTTP API stays behind Nginx.
      # Agent 隧道直接终结 mTLS；HTTP API 继续通过 Nginx 接入。
      - "0.0.0.0:${GATEWAY_TUNNEL_PORT:-8443}:8443"
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9090}:9090"
    depends_on:
      registry:
        condition: service_started
      controlplane:
        condition: service_started
      redis:
        condition: service_healthy

# The Agent runs on the host to reach local inference backends.
# See README.md's "接一个 Agent" for token issuance and startup commands.
# Agent 在宿主机上连接本地推理后端；令牌签发与启动命令统一见 README.md「接一个 Agent」。

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  registry-data:
